<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="中古トラックの公開在庫を横断検索するチャットデモ（株式会社AIdollargame）">
<link rel="icon" href="/favicon.svg">
<title>トラック在庫チャット</title>
<style>
  :root { --blue:#2563eb; --ink:#1e293b; --sub:#64748b; --line:#e2e8f0; --bg:#f6f8fb; --card:#ffffff; --chipbg:#eff6ff; }
  @media (prefers-color-scheme: dark) {
    :root { --blue:#5b8def; --ink:#e6ebf3; --sub:#94a3b8; --line:#2c3646; --bg:#12161d; --card:#1a2029; --chipbg:#1e293b; }
  }
  :root[data-theme="dark"] { --blue:#5b8def; --ink:#e6ebf3; --sub:#94a3b8; --line:#2c3646; --bg:#12161d; --card:#1a2029; --chipbg:#1e293b; }
  :root[data-theme="light"] { --blue:#2563eb; --ink:#1e293b; --sub:#64748b; --line:#e2e8f0; --bg:#f6f8fb; --card:#ffffff; --chipbg:#eff6ff; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Hiragino Sans","Yu Gothic",sans-serif; background:var(--bg); color:var(--ink); font-size:17px; line-height:1.65; }
  .icon { width:20px; height:20px; stroke:currentColor; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; vertical-align:-4px; }
  #gate { max-width:420px; margin:80px auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:36px; text-align:center; }
  #gate h1 { font-size:22px; margin-bottom:6px; }
  #gate p { color:var(--sub); font-size:15px; margin-bottom:20px; }
  #gate input { width:100%; padding:12px 14px; font-size:17px; border:1px solid var(--line); border-radius:8px; margin-bottom:12px; background:var(--card); color:var(--ink); }
  #gate button { width:100%; padding:12px; font-size:17px; background:var(--blue); color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:700; }
  #gateErr { color:#dc2626; font-size:14px; margin-top:10px; display:none; }
  #app { display:none; flex-direction:column; height:100dvh; max-width:860px; margin:0 auto; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 20px; display:flex; align-items:center; gap:12px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; }
  .brand svg { color:var(--blue); width:24px; height:24px; }
  .brand small { font-weight:400; color:var(--sub); font-size:13px; }
  #stock { margin-left:auto; font-size:13px; color:var(--sub); white-space:nowrap; }
  #stock b { color:var(--blue); font-size:16px; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:92%; padding:13px 17px; border-radius:14px; font-size:16px; }
  .me { align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .cars { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .car { display:block; text-decoration:none; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:11px 14px; background:var(--bg); }
  .car:hover { border-color:var(--blue); }
  .car .row1 { display:flex; gap:8px; align-items:baseline; }
  .car .name { font-weight:700; font-size:15.5px; flex:1; }
  .car .price { color:var(--blue); font-weight:800; font-size:18px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .car .row2 { display:flex; gap:10px; font-size:13px; color:var(--sub); margin-top:3px; flex-wrap:wrap; align-items:center; }
  .site { font-size:12px; padding:1px 8px; border-radius:99px; background:var(--chipbg); color:var(--blue); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; padding:0 20px 10px; }
  .chip { font-size:13.5px; padding:7px 13px; border:1px solid var(--line); border-radius:99px; background:var(--card); cursor:pointer; color:var(--ink); }
  .chip:hover { border-color:var(--blue); color:var(--blue); }
  #inputbar { display:flex; gap:10px; padding:0 20px 16px; }
  #inputbar textarea { flex:1; padding:13px 16px; font-size:17px; border:1px solid var(--line); border-radius:12px; resize:none; font-family:inherit; height:52px; background:var(--card); color:var(--ink); }
  #inputbar textarea:focus { outline:2px solid var(--blue); border-color:var(--blue); }
  #inputbar button { padding:0 22px; background:var(--blue); color:#fff; border:none; border-radius:12px; cursor:pointer; }
  footer { text-align:center; font-size:12px; color:var(--sub); padding:0 20px 12px; }
</style>
</head>
<body>

<div id="gate">
  <h1>トラック在庫チャット</h1>
  <p>合言葉を入力してください</p>
  <input type="password" id="pw" placeholder="合言葉">
  <button onclick="login()">ひらく</button>
  <div id="gateErr">合言葉が違います</div>
</div>
<div id="app">
<header>
  <div class="brand">
    <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    トラック在庫チャット <small>公開在庫を横断サーチ</small>
  </div>
  <div id="stock"><b id="stN">-</b>台を横断検索</div>
</header>
<div id="log"></div>
<div class="chips">
  <button class="chip" onclick="ask('大阪府のダンプ 300万以下')">大阪府のダンプ 300万以下</button>
  <button class="chip" onclick="ask('日野の大型ウイング 2018年以降')">日野の大型ウイング 2018年以降</button>
  <button class="chip" onclick="ask('クレーン 低走行')">クレーン 低走行</button>
  <button class="chip" onclick="ask('トラクタ 走行80万km以下')">トラクタ 走行80万km以下</button>
</div>
<div id="inputbar">
  <textarea id="q" placeholder="例: ふそうの大型ウイング 2019年以降 700万以下"></textarea>
  <button onclick="send()" aria-label="送信">
    <svg class="icon" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
  </button>
</div>
<footer id="src"></footer>
</div>

<script>
let RAW = null, L = [];
async function loadData() {
  const b64 = (await (await fetch('data.txt')).text()).replace(/\s/g, '');
  const bin = Uint8Array.from(atob(b64), ch => ch.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  RAW = JSON.parse(await new Response(stream).text());
  L = RAW.rows.map(r => ({ site: RAW.sites[r[0]], url: RAW.prefix[r[0]] + r[1], maker: r[2], model: r[3], body: r[4], cls: r[5], year: r[6], mileage_man: r[7], load_kg: r[8], pref: r[9], price_man: r[10], alts: (r[11]||[]).map(a => ({ site: RAW.sites[a[0]], url: RAW.prefix[a[0]] + a[1] })) }));
  MODELS = [...new Set(L.map(x => x.model).filter(m => m && m.length >= 2 && !/^[A-Z0-9-]+$/.test(m)))];
}
const dataReady = loadData();

const PW = 'truck2026';
const MAKERS = ['日野','いすゞ','三菱ふそう','UDトラックス','トヨタ','日産','マツダ','ダイハツ','スズキ'];
const MAKER_ALIAS = { 'ふそう':'三菱ふそう','三菱':'三菱ふそう','UD':'UDトラックス','日産ディーゼル':'UDトラックス','いすず':'いすゞ','イスズ':'いすゞ' };
const BODIES = [[/冷凍ウイング/,'冷凍ウイング'],[/冷凍|冷蔵|保冷/,'冷凍バン'],[/ウイング|ウィング/,'ウイング'],[/平ボディ|平ボデー|平車/,'平ボディ'],[/ダンプ/,'ダンプ'],[/クレーン|ユニック/,'クレーン'],[/トラクタ|トレーラーヘッド|ヘッド/,'トラクタ'],[/トレーラ/,'トレーラー'],[/高所作業/,'高所作業車'],[/コンテナ/,'コンテナ車'],[/清掃|バキューム/,'清掃・バキューム'],[/シャシ/,'シャシ'],[/ミキサー/,'ミキサー'],[/タンクローリー|ローリー|タンク車/,'タンクローリー'],[/パッカー|塵芥|ゴミ収集/,'パッカー'],[/アームロール|フックロール|脱着/,'アームロール'],[/キャリアカー|積載車|車載車|セルフローダー|ローダー/,'キャリアカー・積載車'],[/散水/,'散水車'],[/幌/,'幌'],[/アルミバン|ドライバン|箱車|バン/,'バン']];
const CLASSES = [[/大型/,'大型'],[/増トン|増t/,'増トン'],[/中型|4t/,'中型'],[/小型|2t|3t/,'小型']];
const PREFS = '北海道 青森県 岩手県 宮城県 秋田県 山形県 福島県 茨城県 栃木県 群馬県 埼玉県 千葉県 東京都 神奈川県 新潟県 富山県 石川県 福井県 山梨県 長野県 岐阜県 静岡県 愛知県 三重県 滋賀県 京都府 大阪府 兵庫県 奈良県 和歌山県 鳥取県 島根県 岡山県 広島県 山口県 徳島県 香川県 愛媛県 高知県 福岡県 佐賀県 長崎県 熊本県 大分県 宮崎県 鹿児島県 沖縄県'.split(' ');
let MODELS = [];

function parse(text) {
  let t = (text || '').replace(/\u3000/g, ' ');
  const c = {};
  for (const p of PREFS) { const short = p.replace(/[都府県]$/, ''); if (t.includes(p) || new RegExp(short + '(の|で|に|\\s|$)').test(t)) { c.pref = p; break; } }
  for (const [alias, m] of Object.entries(MAKER_ALIAS)) if (t.includes(alias)) c.maker = m;
  for (const m of MAKERS) if (t.includes(m)) c.maker = m;
  for (const [re, b] of BODIES) if (re.test(t)) { c.body = b; break; }
  for (const [re, cl] of CLASSES) if (re.test(t)) { c.cls = cl; break; }
  for (const m of MODELS) if (t.includes(m)) c.model = m;
  let mm;
  if ((mm = t.match(/(\d{4})\s*年\s*以降|(\d{4})\s*年式?\s*以上/))) c.yearMin = +(mm[1] || mm[2]);
  if ((mm = t.match(/(\d{4})\s*年\s*以前|(\d{4})\s*年式?\s*以下/))) c.yearMax = +(mm[1] || mm[2]);
  else if ((mm = t.match(/(\d{4})\s*年/)) && !c.yearMin) { c.yearMin = +mm[1] - 2; c.yearMax = +mm[1] + 2; }
  if ((mm = t.match(/(\d+)\s*万円?\s*以下|予算\s*(\d+)\s*万/))) c.priceMax = +(mm[1] || mm[2]);
  if ((mm = t.match(/(\d+)\s*万円?\s*以上/))) c.priceMin = +mm[1];
  if ((mm = t.match(/走行\s*(\d+)\s*万\s*km?\s*以下|(\d+)\s*万\s*km\s*以下/i))) c.milMax = +(mm[1] || mm[2]);
  if (/低走行/.test(t)) c.milMax = c.milMax || 30;
  if (/価格あり|応談以外|値段あり/.test(t)) c.hasPrice = true;
  return c;
}
function run(c) {
  let rows = L.filter(x => {
    if (c.pref && x.pref !== c.pref) return false;
    if (c.maker && x.maker !== c.maker) return false;
    if (c.body && x.body !== c.body) return false;
    if (c.cls && x.cls !== c.cls) return false;
    if (c.model && x.model !== c.model) return false;
    if (c.yearMin && !(x.year && x.year >= c.yearMin)) return false;
    if (c.yearMax && !(x.year && x.year <= c.yearMax)) return false;
    if (c.priceMax && !(x.price_man && x.price_man <= c.priceMax)) return false;
    if (c.priceMin && !(x.price_man && x.price_man >= c.priceMin)) return false;
    if (c.hasPrice && !x.price_man) return false;
    if (c.milMax && !(x.mileage_man != null && x.mileage_man <= c.milMax)) return false;
    return true;
  });
  rows.sort((a, b) => (a.price_man || 1e9) - (b.price_man || 1e9));
  return rows;
}
function condLabel(c) {
  const parts = [];
  if (c.pref) parts.push(c.pref); if (c.maker) parts.push(c.maker); if (c.model) parts.push(c.model);
  if (c.body) parts.push(c.body); if (c.cls) parts.push(c.cls);
  if (c.yearMin && c.yearMax) parts.push(c.yearMin + '〜' + c.yearMax + '年式');
  else if (c.yearMin) parts.push(c.yearMin + '年式以降');
  else if (c.yearMax) parts.push(c.yearMax + '年式以前');
  if (c.priceMax) parts.push(c.priceMax + '万円以下');
  if (c.priceMin) parts.push(c.priceMin + '万円以上');
  if (c.milMax) parts.push('走行' + c.milMax + '万km以下');
  return parts.length ? parts.join('・') : '全在庫';
}
async function login() {
  if (document.getElementById('pw').value === PW) { await dataReady; showApp(); }
  else document.getElementById('gateErr').style.display = 'block';
}
function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('stN').textContent = L.length.toLocaleString();
  document.getElementById('src').textContent = '在庫データ: ' + RAW.meta.sources.map(s => s.name + ' ' + s.n.toLocaleString() + '台').join(' / ') + '(2026-08-05〜06取得・クロール許可サイトのみ)。価格・在庫状況は取得時点のもの。';
  addBot('こんにちは。探している車両の条件を教えてください。地域・メーカー・ボディ・クラス・年式・予算・走行距離を日本語のまま書けばOKです。', null);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function addMe(t) { addRaw('<div class="msg me">' + esc(t) + '</div>'); }
function addBot(t, rows) {
  let html = '<div class="msg bot">' + esc(t);
  if (rows && rows.length) {
    html += '<div class="cars">' + rows.map(r =>
      '<a class="car" href="' + r.url + '" target="_blank" rel="noopener">' +
      '<div class="row1"><span class="name">' + esc((r.maker + ' ' + (r.model || '')).trim()) + '</span><span class="price">' + (r.price_man ? r.price_man + '万円' : '応談') + '</span></div>' +
      '<div class="row2"><span class="site">' + esc(r.site) + '</span><span>' + esc(r.body + (r.cls ? ' / ' + r.cls : '')) + '</span>' +
      (r.year ? '<span>' + r.year + '年式</span>' : '') +
      (r.mileage_man != null ? '<span>走行' + r.mileage_man + '万km</span>' : '') +
      (r.load_kg ? '<span>積載' + r.load_kg.toLocaleString() + 'kg</span>' : '') +
      (r.pref ? '<span>' + esc(r.pref) + '</span>' : '') +
      (r.alts && r.alts.length ? '<span class="site">他掲載: ' + r.alts.map(a => esc(a.site)).join('・') + '</span>' : '') +
      '</div></a>').join('') + '</div>';
  }
  html += '</div>';
  addRaw(html);
}
function addRaw(h) { const log = document.getElementById('log'); log.insertAdjacentHTML('beforeend', h); log.scrollTop = log.scrollHeight; }
function ask(t) { document.getElementById('q').value = t; send(); }
function send() {
  const q = document.getElementById('q');
  const text = q.value.trim();
  if (!text) return;
  q.value = '';
  addMe(text);
  const cond = parse(text);
  const rows = run(cond);
  const label = condLabel(cond);
  let reply;
  if (!Object.keys(cond).length) {
    reply = '条件を読み取れませんでした。「大阪府のダンプ 300万以下」「日野の大型ウイング 2018年以降」のように書いてください。';
  } else if (!rows.length) {
    reply = label + ' に合う在庫は見つかりませんでした。条件を1つ外すか、予算や年式を広げてみてください。';
  } else {
    const priced = rows.filter(r => r.price_man);
    const askN = rows.length - priced.length;
    reply = label + ' の在庫は ' + rows.length + '台';
    if (priced.length) { const ps = priced.map(r => r.price_man); reply += '。価格表示のある' + priced.length + '台は ' + Math.min(...ps) + '〜' + Math.max(...ps) + '万円'; }
    if (askN) reply += '(価格応談' + askN + '台を含む)';
    reply += '。安い順に表示します。';
    if (rows.length > 8) reply += '(上位8台を表示)';
  }
  addBot(reply, rows.slice(0, 8));
}
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) login(); });
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); } });
</script>

</body>
</html>
