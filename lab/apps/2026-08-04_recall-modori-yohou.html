<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リコールもどり予報｜検診に戻ってこない人を先に見つける</title>
<style>
  :root{ --bg:#f5f4f0; --ac:#2563eb; --line:#ddd9d0; --ink:#1a1a1a; --sub:#77736a;
         --grn:#15803d; --amb:#b45309; --red:#b91c1c; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:17px; line-height:1.75; }
  .wrap{ max-width:460px; margin:0 auto; padding:14px 14px 56px; }
  .demo{ display:inline-block; font-size:12px; color:var(--sub);
    border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:2px 10px; margin-bottom:12px; }
  h1{ font-size:24px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub{ color:var(--sub); font-size:15px; margin:0 0 18px; line-height:1.6; }
  h2{ font-size:13px; color:var(--sub); font-weight:700; margin:24px 0 8px;
    letter-spacing:.08em; }
  button{ font-family:inherit; cursor:pointer; }
  a.back{ display:inline-block; font-size:15px; color:var(--ac); text-decoration:none;
    margin-bottom:12px; cursor:pointer; }

  .top{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .top .lb{ font-size:13px; color:var(--sub); }
  .top .big{ font-size:37px; font-weight:700; line-height:1.15;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .top .big span{ font-size:19px; margin-left:2px; }
  .top .two{ display:flex; gap:12px; margin-top:12px; padding-top:12px;
    border-top:1px solid var(--line); }
  .top .two div{ flex:1; }
  .top .two b{ display:block; font-size:22px; font-variant-numeric:tabular-nums;
    line-height:1.3; }

  .card{ background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:13px 15px; margin-bottom:9px; cursor:pointer; }
  .card.done{ opacity:.55; }
  .card .hd{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .card .nm{ font-size:18px; font-weight:600; }
  .card .ag{ font-size:13px; color:var(--sub); }
  .card .tx{ font-size:14px; color:var(--sub); margin-top:1px; }
  .bar{ height:8px; background:#eceae4; border-radius:999px; overflow:hidden;
    margin:9px 0 4px; }
  .bar i{ display:block; height:8px; border-radius:999px; }
  .bl{ display:flex; justify-content:space-between; font-size:13px; color:var(--sub);
    font-variant-numeric:tabular-nums; }
  .bl b{ font-weight:700; }
  .hi{ color:var(--red); } .md{ color:var(--amb); } .lo{ color:var(--grn); }

  .panel{ background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px; }
  .panel.acc{ border-left:4px solid var(--ac); }
  .r{ display:flex; justify-content:space-between; gap:12px; font-size:15px;
    padding:6px 0; border-bottom:1px solid #f0eee8; }
  .r:last-child{ border-bottom:0; }
  .r b{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .why{ font-size:15px; padding:6px 0 6px 16px; position:relative; line-height:1.6; }
  .why:before{ content:''; position:absolute; left:2px; top:15px; width:6px; height:6px;
    border-radius:50%; background:var(--amb); }
  .why.neg:before{ background:var(--grn); }
  .quote{ background:#faf9f6; border:1px solid var(--line); border-radius:11px;
    padding:13px 14px; font-size:16px; line-height:1.8; margin-top:8px; }

  .go{ display:block; width:100%; border:0; background:var(--ac); color:#fff;
    font-size:17px; font-weight:700; border-radius:12px; padding:15px 0; margin-top:10px; }
  .go.gh{ background:#fff; color:var(--ac); border:1.5px solid var(--ac); }
  .ok{ background:#e7f2ea; border-radius:12px; padding:13px 15px; margin-top:12px;
    font-size:15px; color:var(--grn); font-weight:700; line-height:1.7; }
  .note{ font-size:14px; color:var(--sub); line-height:1.7; margin-top:22px;
    border-top:1px solid var(--line); padding-top:14px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ===== サンプルデータ（架空の歯科医院・架空の患者）=====
var P = [
  {id:1, nm:'小野寺 千夏', age:34, m:11, tx:'歯石とり（クリーニング）', key:'clean',
   chukan:false, noshow:false, cancels:1, years:2, val:1.2},
  {id:2, nm:'高梨 亮介', age:48, m:8, tx:'歯周病の治療（途中）', key:'perio',
   chukan:true, noshow:false, cancels:2, years:1, val:5.8},
  {id:3, nm:'三沢 とめ', age:71, m:14, tx:'入れ歯の調整', key:'denture',
   chukan:false, noshow:false, cancels:0, years:6, val:2.4},
  {id:4, nm:'布施 悠真', age:9, m:6, tx:'フッ素塗布（お子さま）', key:'kid',
   chukan:false, noshow:false, cancels:0, years:3, val:0.9},
  {id:5, nm:'岸本 明日香', age:27, m:10, tx:'ホワイトニングのあと', key:'white',
   chukan:false, noshow:true, cancels:1, years:1, val:1.6},
  {id:6, nm:'大久保 健一', age:56, m:7, tx:'インプラントの手入れ', key:'implant',
   chukan:false, noshow:false, cancels:0, years:4, val:3.2},
  {id:7, nm:'芝原 みどり', age:62, m:13, tx:'半年ごとの定期検診', key:'checkup',
   chukan:false, noshow:false, cancels:3, years:5, val:1.2},
  {id:8, nm:'若松 翔', age:22, m:9, tx:'親知らずを抜いたあと 未再診', key:'wisdom',
   chukan:true, noshow:true, cancels:1, years:1, val:4.5}
];
var LINE = {
  clean:   '歯石は3か月ほどでまた付きはじめます',
  perio:   '治療が途中のままですので、進み具合を一度みせてください',
  denture: '入れ歯は少しずつ合わなくなります。噛みにくさはありませんか',
  kid:     '生えかわりの時期なので、半年に一度みせてください',
  white:   '白さは半年ほどでゆっくり戻っていきます',
  implant: 'ねじのゆるみは、痛みが出る前なら短い処置で済みます',
  checkup: '半年ごとの検診の時期になりました',
  wisdom:  '抜いたあとの穴の治り具合を、一度みせてください'
};
var SLOTS_START = 9;   // 今週まだ空いている枠
var status = {};       // id -> 'booked' | 'later'

// もどらない確率（加点を積み上げるだけの単純な式・根拠を全部見せる）
function reasons(p){
  var out = [];
  out.push({t:'最後の来院から ' + p.m + 'か月', v: Math.max(0, p.m-6)*6});
  if(p.cancels) out.push({t:'これまでのキャンセル ' + p.cancels + '回', v:p.cancels*9});
  if(p.noshow)  out.push({t:'連絡なしのキャンセルあり', v:15});
  if(p.chukan)  out.push({t:'治療が途中で止まっている', v:20});
  out.push({t:'通ってくれている年数 ' + p.years + '年', v: -p.years*3});
  return out;
}
function risk(p){
  var r = 15, rs = reasons(p);
  for(var i=0;i<rs.length;i++) r += rs[i].v;
  return Math.max(5, Math.min(95, r));
}
function level(r){ return r>=60 ? 'hi' : r>=40 ? 'md' : 'lo'; }
function barColor(r){ return r>=60 ? 'var(--red)' : r>=40 ? 'var(--amb)' : 'var(--grn)'; }
function called(p){ return !!status[p.id]; }

function targets(){
  var t = P.filter(function(p){ return risk(p) >= 40; });
  t.sort(function(a,b){ return (risk(b)*b.val) - (risk(a)*a.val); });
  return t;
}

var view = {name:'list'};
function render(){
  var el = document.getElementById('app');
  el.innerHTML = view.name==='list' ? viewList() : viewDetail(view.id);
  window.scrollTo(0,0);
}

function viewList(){
  var t = targets();
  var remain = 0, got = 0, booked = 0;
  for(var i=0;i<t.length;i++){
    if(status[t[i].id]==='booked'){ got += t[i].val; booked++; }
    else if(!status[t[i].id]) remain += t[i].val;
  }
  var todo = t.filter(function(p){ return !called(p); }).length;

  var h = '<div class="demo">デモ（サンプルデータ）</div>' +
    '<h1>リコールもどり予報</h1>' +
    '<p class="sub">検診に戻ってこなくなりそうな方を先に見つけて、今週かける順番と声のかけ方を出します。ひまわり歯科（架空）の例です。</p>' +
    '<div class="top">' +
      '<div class="lb">まだ声をかけていない方の年間見込み</div>' +
      '<div class="big">' + remain.toFixed(1) + '<span>万円</span></div>' +
      '<div class="two">' +
        '<div><span class="lb">今週かける人</span><b>' + todo + '人</b></div>' +
        '<div><span class="lb">今週の空き枠</span><b>' + (SLOTS_START - booked) + '枠</b></div>' +
        '<div><span class="lb">予約が入った分</span><b style="color:var(--grn)">' + got.toFixed(1) + '万円</b></div>' +
      '</div>' +
    '</div>' +
    '<h2>かける順（もどらなさ × 見込み額）</h2>';

  for(var j=0;j<t.length;j++){
    var p = t[j], r = risk(p), s = status[p.id];
    h += '<div class="card' + (s ? ' done' : '') + '" onclick="go(\'detail\',' + p.id + ')">' +
      '<div class="hd"><div><div class="nm">' + p.nm + '</div>' +
      '<div class="tx">' + p.tx + '</div></div>' +
      '<div class="ag">' + p.age + '歳</div></div>' +
      '<div class="bar"><i style="width:' + r + '%;background:' + barColor(r) + '"></i></div>' +
      '<div class="bl"><span>もどらない見込み <b class="' + level(r) + '">' + r + '％</b></span>' +
      '<span>' + (s==='booked' ? '予約が入りました' : s==='later' ? 'また今度' : '年 ' + p.val.toFixed(1) + '万円') + '</span></div>' +
    '</div>';
  }

  var safe = P.filter(function(p){ return risk(p) < 40; });
  h += '<h2>いまは声をかけなくていい方（' + safe.length + '人）</h2>';
  for(var k=0;k<safe.length;k++){
    h += '<div class="card" onclick="go(\'detail\',' + safe[k].id + ')">' +
      '<div class="hd"><div><div class="nm">' + safe[k].nm + '</div>' +
      '<div class="tx">' + safe[k].tx + '</div></div>' +
      '<div class="ag lo">' + risk(safe[k]) + '％</div></div></div>';
  }
  h += '<p class="note">確率は来院間隔・キャンセル歴・治療の中断・通院年数から出した目安で、診断ではありません。数字は根拠を全部ひらいて見せるので、受付の方が納得してから電話をかけられます。</p>';
  return h;
}

function viewDetail(id){
  var p = null;
  for(var i=0;i<P.length;i++){ if(P[i].id===id) p = P[i]; }
  var r = risk(p), rs = reasons(p), s = status[p.id];
  var sei = p.nm.split(' ')[0];

  var h = '<a class="back" onclick="go(\'list\')">← 一覧にもどる</a>' +
    '<div class="demo">デモ（サンプルデータ）</div>' +
    '<h1 style="font-size:22px">' + p.nm + ' <span style="font-size:15px;color:var(--sub);font-weight:400">' + p.age + '歳</span></h1>' +
    '<p class="sub">' + p.tx + '／通院 ' + p.years + '年目</p>' +
    '<div class="panel acc">' +
      '<div class="lb" style="font-size:13px;color:var(--sub)">もどらない見込み</div>' +
      '<div style="font-size:40px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums" class="' + level(r) + '">' + r + '％</div>' +
      '<div class="bar"><i style="width:' + r + '%;background:' + barColor(r) + '"></i></div>' +
      '<div class="r" style="margin-top:6px"><span>戻ってくれた場合の年間見込み</span><b>' + p.val.toFixed(1) + '万円</b></div>' +
    '</div>' +
    '<h2>この数字の内訳</h2><div class="panel">' +
      '<div class="r"><span>もともとの見込み</span><b>15</b></div>';
  for(var j=0;j<rs.length;j++){
    h += '<div class="why' + (rs[j].v<0?' neg':'') + '">' + rs[j].t +
         '<b style="float:right;font-variant-numeric:tabular-nums">' +
         (rs[j].v>=0?'＋':'−') + Math.abs(rs[j].v) + '</b></div>';
  }
  h += '<div class="r" style="border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:700">' +
       '<span>合計</span><b>' + r + '％</b></div></div>';

  h += '<h2>電話でのひとこと</h2>' +
    '<div class="quote">' + sei + 'さま、ひまわり歯科です。' + p.m + 'か月ほどあいてしまいましたが、' +
    'お変わりありませんか。' + LINE[p.key] + '。</div>' +
    '<h2>ショートメールで送る文</h2>' +
    '<div class="quote">' + sei + 'さま こんにちは。ひまわり歯科です。<br>' +
    '前回のご来院から' + p.m + 'か月がたちました。' + LINE[p.key] + '。<br>' +
    '今週は木曜と金曜の午後に空きがあります。ご都合よい時間をお返事ください。</div>';

  if(s === 'booked'){
    h += '<div class="ok">予約が入りました。今週の空き枠がひとつ埋まり、年間の見込み ' + p.val.toFixed(1) + '万円が戻ります。</div>' +
         '<button class="go gh" onclick="undo(' + p.id + ')">やり直す</button>';
  } else if(s === 'later'){
    h += '<div class="ok" style="background:#f2ece2;color:var(--amb)">「また今度」で記録しました。3か月後にもう一度この一覧に出ます。</div>' +
         '<button class="go gh" onclick="undo(' + p.id + ')">やり直す</button>';
  } else {
    h += '<button class="go" onclick="mark(' + p.id + ',\'booked\')">連絡した（予約が入った）</button>' +
         '<button class="go gh" onclick="mark(' + p.id + ',\'later\')">連絡した（また今度）</button>';
  }
  h += '<p class="note">文面はそのまま送れる形で出しますが、送信ボタンは受付の方の手元にあります。返事の有無も次の予報に入ります。</p>';
  return h;
}

function mark(id,v){ status[id] = v; go('list'); }
function undo(id){ delete status[id]; render(); }
function go(name,id){ view = {name:name, id:id}; render(); }
render();
</script>
</body>
</html>
