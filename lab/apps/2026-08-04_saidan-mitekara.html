<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>祭壇みてから｜祭壇を式場の絵で見せてから選んでもらう</title>
<style>
  :root{ --bg:#f5f4f0; --ac:#2563eb; --line:#ddd9d0; --ink:#1a1a1a; --sub:#77736a;
         --grn:#15803d; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:17px; line-height:1.75; }
  .wrap{ max-width:460px; margin:0 auto; padding:14px 14px 56px; }
  .demo{ display:inline-block; font-size:12px; color:var(--sub);
    border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:2px 10px; margin-bottom:12px; }
  h1{ font-size:24px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub{ color:var(--sub); font-size:15px; margin:0 0 18px; line-height:1.6; }
  h2{ font-size:13px; color:var(--sub); font-weight:700; margin:24px 0 8px;
    letter-spacing:.08em; }
  button{ font-family:inherit; cursor:pointer; }

  .stage{ background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:12px; overflow:hidden; }
  .stage svg{ display:block; width:100%; height:auto; border-radius:9px; }
  .cap{ font-size:14px; color:var(--sub); margin-top:9px; text-align:center;
    line-height:1.6; }
  .cap b{ color:var(--ink); font-size:16px; }

  .pick{ display:flex; gap:7px; margin-top:12px; }
  .pick button{ flex:1; background:#fff; border:1.5px solid var(--line);
    border-radius:12px; padding:11px 4px; font-size:14px; font-weight:700;
    color:var(--sub); line-height:1.4; }
  .pick button.on{ border-color:var(--ac); color:var(--ac); background:#eef3fe; }
  .pick button small{ display:block; font-weight:400; font-size:12px; margin-top:2px;
    font-variant-numeric:tabular-nums; }

  .money{ background:#fff; border:1px solid var(--line); border-left:4px solid var(--ac);
    border-radius:14px; padding:15px 16px; margin-top:14px; }
  .money .lb{ font-size:13px; color:var(--sub); }
  .money .big{ font-size:37px; font-weight:700; line-height:1.15;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .money .big span{ font-size:19px; margin-left:2px; }
  .r{ display:flex; justify-content:space-between; gap:12px; font-size:15px;
    padding:7px 0; border-bottom:1px solid #f0eee8; }
  .r:last-child{ border-bottom:0; }
  .r b{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .r.sum{ border-top:1px solid var(--line); border-bottom:0; margin-top:4px;
    padding-top:10px; font-weight:700; }

  .go{ display:block; width:100%; border:0; background:var(--ac); color:#fff;
    font-size:17px; font-weight:700; border-radius:12px; padding:15px 0; margin-top:14px; }
  .go.gh{ background:#fff; color:var(--ac); border:1.5px solid var(--ac); }
  .ok{ background:#e7f2ea; border-radius:12px; padding:14px 15px; margin-top:14px;
    font-size:15px; color:var(--grn); line-height:1.7; font-weight:700; }
  .note{ font-size:14px; color:var(--sub); line-height:1.7; margin-top:22px;
    border-top:1px solid var(--line); padding-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="demo">デモ（サンプルデータ）</div>
  <h1>祭壇みてから</h1>
  <p class="sub">祭壇の大きさと花の色を、その場で式場の絵にして見せます。小さなカタログ写真で決めて、あとから悔いが残るのを防ぐための道具です。ひだまり会館（架空）の例です。</p>

  <div class="stage">
    <svg id="sv" viewBox="0 0 320 210" role="img" aria-label="式場と祭壇のイメージ図"></svg>
    <div class="cap" id="cap"></div>
  </div>

  <h2>式場をえらぶ</h2>
  <div class="pick" id="pHall"></div>

  <h2>祭壇をえらぶ</h2>
  <div class="pick" id="pRank"></div>

  <h2>花の色あい</h2>
  <div class="pick" id="pColor"></div>

  <div class="money" id="money"></div>

  <div id="after"></div>

  <p class="note">図はイメージです。実際の花材は季節で変わります。金額は税込の目安で、ご遺体の搬送距離・安置日数・火葬料で上下します。写真の枠はお預かりしたお写真が入る位置を示しています。</p>
</div>

<script>
// ===== サンプルデータ（架空の葬儀会館）=====
var HALLS = [
  {id:'s', nm:'小式場', cap:'30名まで', fee:80000,  scale:0.88},
  {id:'m', nm:'中式場', cap:'60名まで', fee:120000, scale:1.00},
  {id:'l', nm:'大式場', cap:'120名まで',fee:220000, scale:1.14}
];
var RANKS = [
  {id:'k', nm:'白木祭壇', note:'昔ながらの形',   fee:180000, rows:1, w:130, wood:true},
  {id:'h', nm:'花祭壇 標準', note:'いちばん多い', fee:340000, rows:3, w:180, wood:false},
  {id:'j', nm:'花祭壇 上', note:'横に広く花を組む', fee:580000, rows:5, w:230, wood:false}
];
var COLORS = [
  {id:'w', nm:'白 基調',  pal:['#ffffff','#f7f5ef','#e9e5db']},
  {id:'p', nm:'淡い色',   pal:['#ffffff','#f3dee4','#e4e8f3']},
  {id:'y', nm:'明るい色', pal:['#fff2cf','#f8d5d5','#ffffff']}
];
var BASE = 420000; // 棺・搬送・安置・式運営の基本セット
var st = {hall:'m', rank:'h', color:'w', quoted:false};

function find(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; } }
function man(y){ return (y/10000).toFixed(1); }

function drawStage(){
  var hall = find(HALLS, st.hall), rank = find(RANKS, st.rank), col = find(COLORS, st.color);
  var w = Math.round(rank.w * hall.scale);
  var cx = 160, floorY = 165, s = '';

  // 壁と床
  s += '<rect x="0" y="0" width="320" height="165" fill="#efece6"/>';
  s += '<rect x="0" y="165" width="320" height="45" fill="#ddd8cd"/>';
  // 壁の見切り
  s += '<rect x="0" y="158" width="320" height="7" fill="#e5e0d5"/>';
  // 灯明（左右）
  s += '<rect x="26" y="96" width="9" height="62" rx="3" fill="#cfc8b9"/>' +
       '<circle cx="30.5" cy="92" r="7" fill="#f6e6b8"/>';
  s += '<rect x="285" y="96" width="9" height="62" rx="3" fill="#cfc8b9"/>' +
       '<circle cx="289.5" cy="92" r="7" fill="#f6e6b8"/>';

  var left = cx - w/2, top = floorY;
  // 段（3段のひな壇）
  var tiers = rank.rows <= 1 ? 2 : 3;
  for(var t=0;t<tiers;t++){
    var tw = w - t*18, th = 13;
    var y = floorY - (t+1)*th;
    s += '<rect x="' + (cx - tw/2) + '" y="' + y + '" width="' + tw + '" height="' + th +
         '" fill="' + (t%2 ? '#e8e3d8' : '#efeae0') + '" stroke="#d6d0c3"/>';
  }
  var deckY = floorY - tiers*13;

  if(rank.wood){
    // 白木の祭壇
    var hw = w * 0.72;
    s += '<rect x="' + (cx-hw/2) + '" y="' + (deckY-58) + '" width="' + hw + '" height="58" ' +
         'fill="#dcc7a2" stroke="#c9b189"/>';
    s += '<rect x="' + (cx-hw/2+8) + '" y="' + (deckY-50) + '" width="' + (hw-16) + '" height="10" fill="#cbb28c"/>';
    s += '<polygon points="' + (cx-hw/2-6) + ',' + (deckY-58) + ' ' + cx + ',' + (deckY-76) +
         ' ' + (cx+hw/2+6) + ',' + (deckY-58) + '" fill="#d3bb95" stroke="#c0a67e"/>';
    // 足元に少しの花
    for(var i=0;i<7;i++){
      s += '<circle cx="' + (cx - hw/2 + 9 + i*(hw-18)/6) + '" cy="' + (deckY+4) + '" r="4.5" fill="' + col.pal[i%col.pal.length] + '" stroke="#cfc8ba" stroke-width="0.6"/>';
    }
  } else {
    // 花のひな壇
    for(var r=0;r<rank.rows;r++){
      var rw = w - r*16;
      var y2 = deckY - 6 - r*15;
      var n = Math.max(4, Math.round(rw/13));
      for(var c=0;c<n;c++){
        var x = cx - rw/2 + 6 + c*(rw-12)/(n-1);
        var fill = col.pal[(c + r) % col.pal.length];
        s += '<circle cx="' + x.toFixed(1) + '" cy="' + y2 + '" r="5.4" fill="' + fill +
             '" stroke="#cfc8ba" stroke-width="0.6"/>';
      }
    }
    // 緑
    s += '<rect x="' + (cx-w/2) + '" y="' + (deckY-4) + '" width="' + w + '" height="6" rx="3" fill="#c6cfbc"/>';
  }

  // お写真の枠（人物は描きません）
  var fy = deckY - 6 - (rank.wood ? 86 : rank.rows*15 + 18);
  s += '<rect x="' + (cx-27) + '" y="' + fy + '" width="54" height="42" rx="3" fill="#f7f6f2" stroke="#b9b2a4" stroke-width="2"/>';
  s += '<text x="' + cx + '" y="' + (fy+26) + '" font-size="11" fill="#9a948a" text-anchor="middle">お写真</text>';

  document.getElementById('sv').innerHTML = s;
  document.getElementById('cap').innerHTML =
    '<b>' + hall.nm + '</b>（' + hall.cap + '）／<b>' + rank.nm + '</b>／花は' + col.nm +
    '<br>祭壇の幅 およそ ' + (w/40).toFixed(1) + 'm';
}

function chips(elId, arr, key, sub){
  var h = '';
  for(var i=0;i<arr.length;i++){
    var o = arr[i];
    h += '<button class="' + (st[key]===o.id ? 'on' : '') + '" onclick="set(\'' + key + '\',\'' + o.id + '\')">' +
      o.nm + '<small>' + sub(o) + '</small></button>';
  }
  document.getElementById(elId).innerHTML = h;
}

function render(){
  drawStage();
  chips('pHall', HALLS, 'hall', function(o){ return o.cap; });
  chips('pRank', RANKS, 'rank', function(o){ return man(o.fee) + '万円'; });
  chips('pColor', COLORS, 'color', function(o){ return o.nm === '白 基調' ? '定番' : 'ご希望で'; });

  var hall = find(HALLS, st.hall), rank = find(RANKS, st.rank);
  var total = BASE + hall.fee + rank.fee;
  document.getElementById('money').innerHTML =
    '<div class="lb">いまの内容の見積（税込・目安）</div>' +
    '<div class="big">' + man(total) + '<span>万円</span></div>' +
    '<div style="margin-top:10px">' +
      '<div class="r"><span>基本セット（棺・搬送・安置・式の運営）</span><b>' + man(BASE) + '万円</b></div>' +
      '<div class="r"><span>' + hall.nm + ' 使用料</span><b>' + man(hall.fee) + '万円</b></div>' +
      '<div class="r"><span>' + rank.nm + '</span><b>' + man(rank.fee) + '万円</b></div>' +
      '<div class="r sum"><span>合計</span><b>' + man(total) + '万円</b></div>' +
    '</div>';

  document.getElementById('after').innerHTML = st.quoted
    ? '<div class="ok">この内容で見積書を作りました。ご家族の携帯にも同じ絵が届くので、あとから来られたご親族にも同じものを見てもらえます。</div>' +
      '<button class="go gh" onclick="reset()">別の内容で見てみる</button>'
    : '<button class="go" onclick="quote()">この内容で見積を出す</button>';
}
function set(k,v){ st[k] = v; st.quoted = false; render(); }
function quote(){ st.quoted = true; render(); }
function reset(){ st.quoted = false; render(); }
render();
</script>
</body>
</html>
