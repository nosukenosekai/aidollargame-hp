<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あまり資材せり｜現場の余り資材を近隣業者にせりで売る</title>
<style>
  :root{ --bg:#f5f4f0; --ac:#2563eb; --line:#e5e1d8; --ink:#1a1a1a; --sub:#6f6b62;
         --grn:#15803d; --amb:#b45309; --red:#d92d20; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:#e9e6df; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:17px; line-height:1.7; -webkit-font-smoothing:antialiased; }
  .app{ max-width:430px; margin:0 auto; background:var(--bg); min-height:100vh;
    padding-bottom:110px; }
  button{ font-family:inherit; cursor:pointer; }

  .bar{ position:sticky; top:0; z-index:20; background:var(--ac); color:#fff;
    display:flex; align-items:center; padding:13px 14px 12px; gap:6px; }
  .bar .ttl{ flex:1; font-size:17px; font-weight:700; }
  .bar .ttl.mid{ text-align:center; }
  .bar .dm{ font-size:11px; background:rgba(255,255,255,.22); border-radius:999px;
    padding:3px 9px; white-space:nowrap; }
  .bar .bk{ background:none; border:0; color:#fff; padding:0; width:26px; height:26px; }
  .bar .bk svg{ width:24px; height:24px; fill:none; stroke:#fff; stroke-width:2.2;
    stroke-linecap:round; stroke-linejoin:round; }

  .hero{ background:var(--ac); color:#fff; padding:8px 18px 32px; }
  .hero .lb{ font-size:12.5px; opacity:.85; }
  .hero .big{ font-size:44px; font-weight:700; line-height:1.1; letter-spacing:-.03em;
    font-variant-numeric:tabular-nums; }
  .hero .big i{ font-size:18px; font-style:normal; font-weight:600; margin-left:2px; }
  .hero .two{ display:flex; gap:10px; margin-top:12px; }
  .hero .two div{ flex:1; background:rgba(255,255,255,.15); border-radius:11px;
    padding:8px 11px; font-size:12px; }
  .hero .two b{ display:block; font-size:19px; font-weight:700;
    font-variant-numeric:tabular-nums; line-height:1.4; }

  .sheet{ background:var(--bg); border-radius:20px 20px 0 0; margin-top:-18px;
    position:relative; padding:16px 14px 0; }

  .sec{ display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 9px; }
  .sec h2{ font-size:18px; font-weight:700; margin:0; }
  .sec span{ font-size:13.5px; color:var(--sub); }

  .card{ background:#fff; border-radius:14px; padding:14px; margin-bottom:10px;
    box-shadow:0 1px 2px rgba(20,18,14,.06); }
  .lot{ cursor:pointer; }
  .lot .tt{ font-size:18.5px; font-weight:700; line-height:1.4; margin-top:3px; }
  .lot .st{ font-size:13.5px; color:var(--sub); }
  .lot .bt{ display:flex; align-items:flex-end; justify-content:space-between;
    gap:10px; margin-top:9px; padding-top:9px; border-top:1px solid #f1efe9; }
  .lot .pr{ font-size:26px; font-weight:700; color:var(--ac); letter-spacing:-.02em;
    font-variant-numeric:tabular-nums; line-height:1.15; }
  .lot .pr i{ font-size:14px; font-style:normal; margin-left:1px; }
  .lot .cn{ font-size:13px; color:var(--sub); text-align:right; white-space:nowrap; }
  .lot.done{ opacity:.6; }

  .tag{ display:inline-block; font-size:11px; font-weight:700; border-radius:5px;
    padding:2px 7px; margin-right:6px; }
  .tag.new{ background:var(--red); color:#fff; }
  .tag.out{ border:1px solid var(--line); color:var(--sub); }
  .tag.ok{ background:#e7f2ea; color:var(--grn); }
  .tag.wa{ background:#fdf1e3; color:var(--amb); }

  .rw{ display:flex; justify-content:space-between; gap:12px; font-size:15.5px;
    padding:9px 0; border-top:1px solid #f1efe9; }
  .rw:first-child{ border-top:0; }
  .rw b{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .rw.big b{ font-size:19px; }

  .bid{ display:flex; align-items:center; gap:10px; font-size:15.5px; padding:10px 0;
    border-top:1px solid #f1efe9; }
  .bid:first-child{ border-top:0; }
  .bid .rk{ width:24px; height:24px; border-radius:8px; background:#eceae4; color:var(--sub);
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
  .bid.top .rk{ background:var(--ac); color:#fff; }
  .bid b{ margin-left:auto; font-variant-numeric:tabular-nums; }
  .bid.top b{ color:var(--ac); font-size:18px; }

  label{ display:block; font-size:13.5px; color:var(--sub); font-weight:700;
    margin:16px 2px 6px; }
  select,input{ width:100%; font-family:inherit; font-size:17px; padding:13px 14px;
    border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);
    -webkit-appearance:none; }
  .est{ background:#e8effd; border-radius:14px; padding:14px 15px; margin-top:16px;
    font-size:15px; line-height:1.7; }
  .est b{ font-size:23px; font-variant-numeric:tabular-nums; }
  .okbox{ background:#e7f2ea; border-radius:14px; padding:14px 15px; margin-top:12px;
    font-size:15px; color:var(--grn); font-weight:700; line-height:1.7; }
  .foot{ font-size:13.5px; color:var(--sub); line-height:1.7; padding:16px 2px 4px; }
  .empty{ text-align:center; color:var(--sub); font-size:15px; padding:40px 20px; }

  .dock{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff;
    border-top:1px solid var(--line); max-width:430px; margin:0 auto; }
  .tabs{ display:flex; padding:6px 0 max(8px, env(safe-area-inset-bottom)); }
  .tabs button{ flex:1; background:none; border:0; color:var(--sub); font-size:11px;
    font-weight:700; display:flex; flex-direction:column; align-items:center; gap:2px; padding:3px 0; }
  .tabs button.on{ color:var(--ac); }
  .tabs svg{ width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round; }
  .cta{ padding:11px 14px max(12px, env(safe-area-inset-bottom)); }
  .pill{ display:block; width:100%; border:0; border-radius:999px; background:var(--ac);
    color:#fff; font-size:17.5px; font-weight:700; padding:15px 0; line-height:1.35;
    box-shadow:0 3px 10px rgba(37,99,235,.3); }
  .pill small{ display:block; font-size:12px; font-weight:400; opacity:.92; }
  .pill.gh{ background:#fff; color:var(--ac); border:1.5px solid var(--ac); box-shadow:none; }
  .pill:disabled{ background:#dcd9d2; color:#8b877e; box-shadow:none; }
</style>
</head>
<body>
<div class="app"><div id="top"></div><div id="body"></div></div>
<div class="dock" id="dock"></div>

<script>
// ===== サンプルデータ（架空の建設会社・近隣業者）=====
var KIND = {
  pipe:  {nm:'単管パイプ 4m',      unit:'本', price:520,  waste:260},
  ply:   {nm:'型枠合板 12mm',      unit:'枚', price:850,  waste:220},
  rebar: {nm:'異形鉄筋 D13 5.5m',  unit:'本', price:2300, waste:600},
  pvc:   {nm:'塩ビ管 VP50 4m',     unit:'本', price:560,  waste:180},
  ita:   {nm:'足場板 900mm',       unit:'枚', price:255,  waste:230},
  glass: {nm:'グラスウール 100mm', unit:'袋', price:900,  waste:300}
};
var COND = { new:{nm:'未使用',k:1.0}, a:{nm:'中古A',k:0.72}, b:{nm:'中古B',k:0.45} };
var BIDDERS = ['みなと設備','川口鋼建','東和リース','北町工務店','さくら解体','三州資材','大鳥居建材'];
var LOTS = [
  {id:1, kind:'rebar', qty:40,  cond:'new', site:'新川崎 3丁目 現場', nbid:7, sold:false, fresh:true},
  {id:2, kind:'ply',   qty:80,  cond:'new', site:'鶴見 倉庫改修 現場', nbid:5, sold:false, fresh:true},
  {id:3, kind:'ita',   qty:200, cond:'b',   site:'蒲田 解体 現場',     nbid:4, sold:false, fresh:false},
  {id:4, kind:'pipe',  qty:120, cond:'a',   site:'新川崎 3丁目 現場', nbid:3, sold:false, fresh:false},
  {id:5, kind:'pvc',   qty:60,  cond:'new', site:'大森 集合住宅 現場', nbid:2, sold:false, fresh:false},
  {id:6, kind:'glass', qty:30,  cond:'new', site:'鶴見 倉庫改修 現場', nbid:3, sold:false, fresh:false}
];
var nextId = 7;
function bidOf(l){ return Math.round(KIND[l.kind].price*l.qty*COND[l.cond].k); }
function wasteOf(l){ return KIND[l.kind].waste*l.qty; }
function gainOf(l){ return bidOf(l)+wasteOf(l); }
function man(y){ return (y/10000).toFixed(1); }
function title(l){ return KIND[l.kind].nm + ' ' + l.qty + KIND[l.kind].unit; }
function history(l){
  var top = bidOf(l), out = [];
  for(var i=0;i<l.nbid;i++)
    out.push({ who:BIDDERS[(l.id*3+i)%BIDDERS.length], amt:Math.round(top*(1-i*0.06)) });
  return out;
}
function find(id){ for(var i=0;i<LOTS.length;i++){ if(LOTS[i].id===id) return LOTS[i]; } }

var tab = 'find', view = null, form = {kind:'pipe', qty:100, cond:'new'};

function ico(d){ return '<svg viewBox="0 0 24 24"><path d="' + d + '"/></svg>'; }
var TAB = [
  {id:'find',  nm:'さがす',  d:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14M20 20l-4-4'},
  {id:'new',   nm:'出品する', d:'M12 5v14M5 12h14'},
  {id:'deals', nm:'取引',    d:'M5 13l4 4L19 7'}
];

function render(){
  var t = document.getElementById('top'), b = document.getElementById('body');
  if(view){ t.innerHTML = barBack(view.ttl); b.innerHTML = view.name==='detail' ? viewDetail(view.id) : ''; }
  else {
    t.innerHTML = '<div class="bar"><div class="ttl">あまり資材せり</div>' +
      '<div class="dm">デモ（サンプルデータ）</div></div>';
    b.innerHTML = tab==='find' ? viewFind() : tab==='new' ? viewNew() : viewDeals();
  }
  renderDock();
  window.scrollTo(0,0);
}
function barBack(t){
  return '<div class="bar"><button class="bk" onclick="back()">' +
    '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>' +
    '<div class="ttl mid">' + t + '</div><div style="width:26px"></div></div>';
}

function viewFind(){
  var live = LOTS.filter(function(x){ return !x.sold; });
  var bidSum = 0, wasteSum = 0;
  for(var i=0;i<LOTS.length;i++){ bidSum += bidOf(LOTS[i]); wasteSum += wasteOf(LOTS[i]); }
  var h = '<div class="hero"><div class="lb">今月ここまでの効果（出品中をふくむ）</div>' +
    '<div class="big">' + man(bidSum+wasteSum) + '<i>万円</i></div>' +
    '<div class="two"><div>資材の代金<b>' + man(bidSum) + '万円</b></div>' +
    '<div>浮いた処分費<b>' + man(wasteSum) + '万円</b></div></div></div>' +
    '<div class="sheet"><div class="sec"><h2>出品中</h2><span>' + live.length + '件</span></div>';
  for(var j=0;j<LOTS.length;j++){ if(!LOTS[j].sold) h += lotCard(LOTS[j]); }
  h += '<div class="foot">捨てれば処分費、売れば代金。近隣10km以内の業者だけに声がかかります。' +
       '運営手数料は落札額の5％です。</div></div>';
  return h;
}
function lotCard(l){
  var tags = (l.fresh ? '<span class="tag new">NEW</span>' : '') +
    (wasteOf(l) > bidOf(l) ? '<span class="tag wa">処分費のほうが大きい</span>'
                           : '<span class="tag out">' + COND[l.cond].nm + '</span>');
  return '<div class="card lot' + (l.sold?' done':'') + '" onclick="open_(' + l.id + ')">' +
    '<div>' + tags + '</div><div class="tt">' + title(l) + '</div>' +
    '<div class="st">' + l.site + '</div>' +
    '<div class="bt"><div class="pr">' + man(bidOf(l)) + '<i>万円</i></div>' +
    '<div class="cn">' + (l.sold ? '落札ずみ' : '入札 ' + l.nbid + '社') + '</div></div></div>';
}
function viewDeals(){
  var done = LOTS.filter(function(x){ return x.sold; });
  var sum = 0;
  for(var i=0;i<done.length;i++) sum += gainOf(done[i]);
  var h = '<div class="hero"><div class="lb">落札ずみの効果</div>' +
    '<div class="big">' + man(sum) + '<i>万円</i></div>' +
    '<div class="two"><div>成立した取引<b>' + done.length + '件</b></div>' +
    '<div>手数料<b>' + man(Math.round(sum*0.05)) + '万円</b></div></div></div>' +
    '<div class="sheet"><div class="sec"><h2>取引</h2><span>' + done.length + '件</span></div>';
  if(!done.length) h += '<div class="empty">まだ落札ずみの取引はありません。<br>「さがす」から出品中の資材を開いて、落札を決めてください。</div>';
  for(var j=0;j<done.length;j++) h += lotCard(done[j]);
  h += '</div>';
  return h;
}

function viewDetail(id){
  var l = find(id), hs = history(l);
  var h = '<div class="hero"><div class="lb">いちばん高い札</div>' +
    '<div class="big">' + man(bidOf(l)) + '<i>万円</i></div>' +
    '<div class="two"><div>捨てた場合の処分費<b>' + man(wasteOf(l)) + '万円</b></div>' +
    '<div>売った場合の差<b>＋' + man(gainOf(l)) + '万円</b></div></div></div>' +
    '<div class="sheet">' +
    '<div class="card"><div>' +
      (wasteOf(l) > bidOf(l) ? '<span class="tag wa">処分費のほうが大きい</span>' : '') +
      '<span class="tag out">' + COND[l.cond].nm + '</span></div>' +
      '<div class="lot"><div class="tt">' + title(l) + '</div>' +
      '<div class="st">' + l.site + '</div></div>' +
      '<div class="rw" style="margin-top:9px"><span>運営手数料（5％）</span>' +
      '<b>−' + man(Math.round(bidOf(l)*0.05)) + '万円</b></div>' +
      '<div class="rw big"><span>手取りの見込み</span>' +
      '<b style="color:var(--grn)">' + man(gainOf(l)-Math.round(bidOf(l)*0.05)) + '万円</b></div>' +
    '</div>' +
    '<div class="sec"><h2>入札の状況</h2><span>' + l.nbid + '社</span></div><div class="card">';
  for(var i=0;i<hs.length;i++){
    h += '<div class="bid' + (i===0?' top':'') + '"><div class="rk">' + (i+1) + '</div>' +
      '<span>' + hs[i].who + '</span><b>' + man(hs[i].amt) + '万円</b></div>';
  }
  h += '</div>';
  if(l.sold) h += '<div class="okbox">' + hs[0].who + 'さんに落札されました。引き取り日の連絡が送られています。</div>';
  h += '<div class="foot">入札額は資材の相場と数量から出した目安です。' +
       '実際は引き取り条件や現物の状態で上下します。</div></div>';
  return h;
}

function viewNew(){
  var l = {id:0, kind:form.kind, qty:form.qty, cond:form.cond};
  var h = '<div class="hero"><div class="lb">出品する</div>' +
    '<div class="big" style="font-size:26px;line-height:1.4">3つ選ぶだけ</div>' +
    '<div class="cap" style="font-size:12.5px;opacity:.85">近隣で探している業者に、その場で声がかかります</div></div>' +
    '<div class="sheet">' +
    '<label>資材の種類</label><select onchange="setF(\'kind\',this.value)">';
  for(var k in KIND) h += '<option value="' + k + '"' + (form.kind===k?' selected':'') + '>' + KIND[k].nm + '</option>';
  h += '</select><label>数量（' + KIND[form.kind].unit + '）</label>' +
    '<input id="fq" type="number" inputmode="numeric" value="' + form.qty + '" oninput="setF(\'qty\',this.value)">' +
    '<label>状態</label><select onchange="setF(\'cond\',this.value)">';
  for(var c in COND) h += '<option value="' + c + '"' + (form.cond===c?' selected':'') + '>' + COND[c].nm + '</option>';
  h += '</select>';
  if(form.qty>0){
    h += '<div class="est">落札の目安は <b>' + man(bidOf(l)) + '万円</b>。<br>' +
      '捨てずに済む処分費が <b>' + man(wasteOf(l)) + '万円</b>。<br>' +
      '半径10km以内で ' + (3 + (form.qty%4)) + ' 社がこの資材を探しています。</div>';
  }
  h += '<div class="foot">出品すると近隣業者に通知が飛び、入札が入ります。' +
       '引き取り日・積み込み・運搬の分担は落札後に決めます。</div></div>';
  return h;
}

function renderDock(){
  var d = document.getElementById('dock');
  if(view && view.name==='detail'){
    var l = find(view.id), hs = history(l);
    d.innerHTML = '<div class="cta">' + (l.sold
      ? '<button class="pill gh" onclick="back()">一覧にもどる</button>'
      : '<button class="pill" onclick="sell(' + l.id + ')">' + hs[0].who + 'さんに決める' +
        '<small>＼処分費こみで＋' + man(gainOf(l)) + '万円／</small></button>') + '</div>';
    return;
  }
  if(tab==='new'){
    d.innerHTML = '<div class="cta"><button class="pill"' + (form.qty>0?'':' disabled') +
      ' onclick="create()">この内容で出品する<small>＼近隣に今すぐ通知／</small></button></div>';
    return;
  }
  var h = '<div class="tabs">';
  for(var i=0;i<TAB.length;i++)
    h += '<button class="' + (tab===TAB[i].id?'on':'') + '" onclick="setTab(\'' + TAB[i].id + '\')">' +
      ico(TAB[i].d) + TAB[i].nm + '</button>';
  d.innerHTML = h + '</div>';
}

function setTab(t){ tab = t; view = null; render(); }
function open_(id){ view = {name:'detail', id:id, ttl:'出品の詳細'}; render(); }
function back(){ view = null; render(); }
function sell(id){ find(id).sold = true; render(); }
function setF(k,v){
  form[k] = (k==='qty') ? (parseInt(v,10)||0) : v;
  render();
  if(k==='qty'){ var i = document.getElementById('fq'); if(i) i.focus(); }
}
function create(){
  LOTS.unshift({id:nextId, kind:form.kind, qty:form.qty, cond:form.cond,
    site:'新川崎 3丁目 現場', nbid:2+(form.qty%4), sold:false, fresh:true});
  view = {name:'detail', id:nextId, ttl:'出品の詳細'};
  nextId++; render();
}
render();
</script>
</body>
</html>
