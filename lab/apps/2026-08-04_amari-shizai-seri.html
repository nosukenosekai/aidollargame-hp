<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あまり資材せり｜現場の余り資材を近隣業者にせりで売る</title>
<style>
  :root{ --bg:#f5f4f0; --ac:#2563eb; --line:#ddd9d0; --ink:#1a1a1a; --sub:#77736a;
         --grn:#15803d; --amb:#b45309; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:17px; line-height:1.75; }
  .wrap{ max-width:460px; margin:0 auto; padding:14px 14px 56px; }
  .demo{ display:inline-block; font-size:12px; color:var(--sub);
    border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:2px 10px; margin-bottom:12px; }
  h1{ font-size:24px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub{ color:var(--sub); font-size:15px; margin:0 0 18px; line-height:1.6; }
  h2{ font-size:13px; color:var(--sub); font-weight:700; margin:26px 0 8px;
    letter-spacing:.08em; }
  button{ font-family:inherit; cursor:pointer; }
  a.back{ display:inline-block; font-size:15px; color:var(--ac); text-decoration:none;
    margin-bottom:12px; cursor:pointer; }

  .tot{ background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:16px; }
  .tot .lb{ font-size:13px; color:var(--sub); }
  .tot .big{ font-size:36px; font-weight:700; line-height:1.15;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--grn); }
  .tot .big span{ font-size:19px; margin-left:2px; }
  .tot .brk{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line);
    font-size:14px; color:var(--sub); display:flex; justify-content:space-between; }
  .tot .brk b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  .card{ background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:9px; cursor:pointer; }
  .card .nm{ font-size:18px; font-weight:600; line-height:1.4; }
  .card .qt{ font-size:14px; color:var(--sub); }
  .card .row{ display:flex; justify-content:space-between; align-items:flex-end;
    gap:10px; margin-top:8px; }
  .card .bid{ font-size:22px; font-weight:700; color:var(--ac);
    font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .card .bid span{ font-size:14px; margin-left:1px; }
  .card .cnt{ font-size:13px; color:var(--sub); text-align:right; white-space:nowrap; }
  .tag{ display:inline-block; font-size:12px; font-weight:700; border-radius:6px;
    padding:1px 7px; margin-right:5px; }
  .tag.mi{ background:#e7f2ea; color:var(--grn); }
  .tag.ca{ background:#f2ece2; color:var(--amb); }
  .tag.sold{ background:#eceae4; color:var(--sub); }

  .r{ display:flex; justify-content:space-between; gap:12px; font-size:15px;
    padding:7px 0; border-bottom:1px solid #f0eee8; }
  .r:last-child{ border-bottom:0; }
  .r b{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .panel{ background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px; }
  .panel.hi{ border-left:4px solid var(--ac); }

  .hist{ font-size:15px; padding:8px 0; border-bottom:1px solid #f0eee8;
    display:flex; justify-content:space-between; gap:10px; }
  .hist:last-child{ border-bottom:0; }
  .hist .who{ color:var(--sub); font-size:14px; }
  .hist b{ font-variant-numeric:tabular-nums; }
  .hist.top b{ color:var(--ac); }

  .go{ display:block; width:100%; border:0; background:var(--ac); color:#fff;
    font-size:17px; font-weight:700; border-radius:12px; padding:15px 0;
    margin-top:14px; }
  .go.gh{ background:#fff; color:var(--ac); border:1.5px solid var(--ac); }
  .go:disabled{ background:#dcd9d2; color:#8b877e; }

  label{ display:block; font-size:14px; color:var(--sub); margin:12px 0 4px; }
  select,input{ width:100%; font-family:inherit; font-size:17px; padding:11px 12px;
    border:1px solid var(--line); border-radius:11px; background:#fff; color:var(--ink);
    -webkit-appearance:none; }
  .est{ background:#eef3fe; border-radius:11px; padding:12px 14px; margin-top:14px;
    font-size:15px; line-height:1.6; }
  .est b{ font-size:20px; font-variant-numeric:tabular-nums; }
  .note{ font-size:14px; color:var(--sub); line-height:1.7; margin-top:20px;
    border-top:1px solid var(--line); padding-top:14px; }
  .ok{ background:#e7f2ea; border-radius:11px; padding:12px 14px; margin-top:12px;
    font-size:15px; color:var(--grn); font-weight:700; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ===== サンプルデータ（架空の建設会社・近隣業者）=====
var KIND = {
  pipe:  {nm:'単管パイプ 4m',      unit:'本', price:520,  waste:260},
  ply:   {nm:'型枠合板 12mm',      unit:'枚', price:850,  waste:220},
  rebar: {nm:'異形鉄筋 D13 5.5m',  unit:'本', price:2300, waste:600},
  pvc:   {nm:'塩ビ管 VP50 4m',     unit:'本', price:560,  waste:180},
  ita:   {nm:'足場板 900mm',       unit:'枚', price:255,  waste:230},
  glass: {nm:'グラスウール 100mm', unit:'袋', price:900,  waste:300}
};
var COND = { new:{nm:'未使用', k:1.0}, a:{nm:'中古A（きれい）', k:0.72}, b:{nm:'中古B（使用感あり）', k:0.45} };
var BIDDERS = ['みなと設備','川口鋼建','東和リース','北町工務店','さくら解体','三州資材','大鳥居建材'];

var LOTS = [
  {id:1, kind:'rebar', qty:40,  cond:'new', site:'新川崎 3丁目 現場', nbid:7, sold:false},
  {id:2, kind:'ply',   qty:80,  cond:'new', site:'鶴見 倉庫改修 現場', nbid:5, sold:false},
  {id:3, kind:'ita',   qty:200, cond:'b',   site:'蒲田 解体 現場',     nbid:4, sold:false},
  {id:4, kind:'pipe',  qty:120, cond:'a',   site:'新川崎 3丁目 現場', nbid:3, sold:false},
  {id:5, kind:'pvc',   qty:60,  cond:'new', site:'大森 集合住宅 現場', nbid:2, sold:false},
  {id:6, kind:'glass', qty:30,  cond:'new', site:'鶴見 倉庫改修 現場', nbid:3, sold:false}
];
var nextId = 7;

// 落札額＝定価×数量×状態係数、処分費＝単位処分費×数量
function bidOf(l){ return Math.round(KIND[l.kind].price * l.qty * COND[l.cond].k); }
function wasteOf(l){ return KIND[l.kind].waste * l.qty; }
function gainOf(l){ return bidOf(l) + wasteOf(l); }
function man(y){ return (y/10000).toFixed(1); }
function title(l){ return KIND[l.kind].nm + ' ' + l.qty + KIND[l.kind].unit; }

// 入札履歴（最高額から一定の刻みで下げた札を並べる）
function history(l){
  var top = bidOf(l), out = [];
  for(var i=0;i<l.nbid;i++){
    out.push({ who: BIDDERS[(l.id*3+i) % BIDDERS.length],
               amt: Math.round(top * (1 - i*0.06)) });
  }
  return out;
}

var view = {name:'list'}, form = {kind:'pipe', qty:100, cond:'new'};

function render(){
  var el = document.getElementById('app');
  if(view.name==='list')   el.innerHTML = viewList();
  if(view.name==='detail') el.innerHTML = viewDetail(view.id);
  if(view.name==='new')    el.innerHTML = viewNew();
  window.scrollTo(0,0);
}

function viewList(){
  var live = 0, done = 0;
  for(var i=0;i<LOTS.length;i++){ if(LOTS[i].sold) done += gainOf(LOTS[i]); else live += gainOf(LOTS[i]); }
  var bidSum = 0, wasteSum = 0;
  for(var j=0;j<LOTS.length;j++){ bidSum += bidOf(LOTS[j]); wasteSum += wasteOf(LOTS[j]); }

  var h = '<div class="demo">デモ（サンプルデータ）</div>' +
    '<h1>あまり資材せり</h1>' +
    '<p class="sub">現場に余った資材を近隣の業者にせりで売ります。捨てれば処分費、売れば代金。あさひ建設（架空）の出品中の一覧です。</p>' +
    '<div class="tot">' +
      '<div class="lb">出品中と落札ずみの合計（今月）</div>' +
      '<div class="big">' + man(bidSum + wasteSum) + '<span>万円</span></div>' +
      '<div class="brk"><span>資材の代金</span><b>' + man(bidSum) + '万円</b></div>' +
      '<div class="brk"><span>捨てずに済んだ処分費</span><b>' + man(wasteSum) + '万円</b></div>' +
    '</div>' +
    '<button class="go" onclick="go(\'new\')">余った資材を出品する</button>' +
    '<h2>出品中（' + LOTS.filter(function(x){return !x.sold;}).length + '件）</h2>';

  for(var k=0;k<LOTS.length;k++){
    var l = LOTS[k];
    var tag = l.sold ? '<span class="tag sold">落札ずみ</span>'
                     : (wasteOf(l) > bidOf(l) ? '<span class="tag ca">処分費のほうが大きい</span>'
                                              : '<span class="tag mi">' + COND[l.cond].nm + '</span>');
    h += '<div class="card" onclick="go(\'detail\',' + l.id + ')">' +
      '<div>' + tag + '</div>' +
      '<div class="nm">' + title(l) + '</div>' +
      '<div class="qt">' + l.site + '</div>' +
      '<div class="row"><div class="bid">' + man(bidOf(l)) + '<span>万円</span></div>' +
      '<div class="cnt">' + (l.sold ? '取引おわり' : '入札 ' + l.nbid + '社') + '</div></div>' +
    '</div>';
  }
  h += '<p class="note">価格は資材の種類・数量・状態から自動で目安を出し、近隣業者の入札で決まります。運営手数料は落札額の5％の想定。実際の取引では引き取り日・積み込み・運搬の分担を出品時に決めます。</p>';
  return h;
}

function viewDetail(id){
  var l = null;
  for(var i=0;i<LOTS.length;i++){ if(LOTS[i].id===id) l = LOTS[i]; }
  var hs = history(l);
  var h = '<a class="back" onclick="go(\'list\')">← 一覧にもどる</a>' +
    '<div class="demo">デモ（サンプルデータ）</div>' +
    '<h1 style="font-size:21px">' + title(l) + '</h1>' +
    '<p class="sub">' + l.site + '／' + COND[l.cond].nm + '</p>' +
    '<div class="panel hi">' +
      '<div class="r"><span>いちばん高い札</span><b style="color:var(--ac);font-size:19px">' + man(bidOf(l)) + '万円</b></div>' +
      '<div class="r"><span>捨てた場合の処分費</span><b>' + man(wasteOf(l)) + '万円</b></div>' +
      '<div class="r"><span>売った場合の差し引き</span><b style="color:var(--grn)">＋' + man(gainOf(l)) + '万円</b></div>' +
      '<div class="r"><span>運営手数料（5％）</span><b>−' + man(Math.round(bidOf(l)*0.05)) + '万円</b></div>' +
    '</div>' +
    '<h2>入札の状況</h2><div class="panel">';
  for(var j=0;j<hs.length;j++){
    h += '<div class="hist' + (j===0?' top':'') + '"><span class="who">' + hs[j].who +
         (j===0?'（最高）':'') + '</span><b>' + man(hs[j].amt) + '万円</b></div>';
  }
  h += '</div>';
  if(l.sold){
    h += '<div class="ok">' + hs[0].who + 'さんに落札されました。引き取り日の連絡が送られています。</div>';
  } else {
    h += '<button class="go" onclick="sell(' + l.id + ')">' + hs[0].who + 'さんに決める（落札）</button>' +
         '<button class="go gh" onclick="go(\'list\')">まだ様子を見る</button>';
  }
  h += '<p class="note">入札額は資材の相場と数量から出した目安です。実際は引き取り条件や現物の状態で上下します。</p>';
  return h;
}

function viewNew(){
  var l = {id:0, kind:form.kind, qty:form.qty, cond:form.cond};
  var ok = form.qty > 0;
  var h = '<a class="back" onclick="go(\'list\')">← 一覧にもどる</a>' +
    '<div class="demo">デモ（サンプルデータ）</div>' +
    '<h1 style="font-size:22px">余った資材を出品する</h1>' +
    '<p class="sub">3つ選ぶだけです。近隣で探している業者に、その場で声がかかります。</p>' +
    '<div class="panel">' +
    '<label>資材の種類</label><select id="fk" onchange="setF(\'kind\',this.value)">';
  for(var k in KIND){ h += '<option value="' + k + '"' + (form.kind===k?' selected':'') + '>' + KIND[k].nm + '</option>'; }
  h += '</select><label>数量（' + KIND[form.kind].unit + '）</label>' +
    '<input id="fq" type="number" inputmode="numeric" value="' + form.qty + '" oninput="setF(\'qty\',this.value)">' +
    '<label>状態</label><select id="fc" onchange="setF(\'cond\',this.value)">';
  for(var c in COND){ h += '<option value="' + c + '"' + (form.cond===c?' selected':'') + '>' + COND[c].nm + '</option>'; }
  h += '</select>';
  if(ok){
    h += '<div class="est">この条件だと落札の目安は <b>' + man(bidOf(l)) + '万円</b>。' +
      'さらに、捨てずに済む処分費が <b>' + man(wasteOf(l)) + '万円</b>。<br>' +
      '半径10km以内で ' + (3 + (form.qty % 4)) + ' 社がこの資材を探しています。</div>';
  }
  h += '</div>' +
    '<button class="go"' + (ok?'':' disabled') + ' onclick="create()">この内容で出品する</button>' +
    '<p class="note">出品後は近隣業者に通知が飛び、入札が入ります。引き取りまで決まったら台帳に残るので、現場ごとの処分費の削減額がそのまま数字で見えます。</p>';
  return h;
}

function setF(k,v){
  form[k] = (k==='qty') ? (parseInt(v,10) || 0) : v;
  render();
  if(k==='qty'){ var i = document.getElementById('fq'); if(i){ i.focus(); } }
}
function create(){
  LOTS.unshift({id:nextId, kind:form.kind, qty:form.qty, cond:form.cond,
                site:'新川崎 3丁目 現場', nbid:2 + (form.qty % 4), sold:false});
  view = {name:'detail', id:nextId};
  nextId++;
  render();
}
function sell(id){
  for(var i=0;i<LOTS.length;i++){ if(LOTS[i].id===id) LOTS[i].sold = true; }
  render();
}
function go(name,id){ view = {name:name, id:id}; render(); }
render();
</script>
</body>
</html>
