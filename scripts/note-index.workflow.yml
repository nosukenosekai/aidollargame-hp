name: 公式note一覧の同期

# noteに新しい記事を出しても、自社サイト側は静的HTMLなので放っておくと古いままになる。
# 毎朝noteのAPIを見て、増えていれば note.html / sitemap.xml / llms.txt を書き直す。
on:
  schedule:
    - cron: '20 0 * * *'   # 09:20 JST
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate note index
        run: python scripts/generate_note_index.py

      - name: Commit and push if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add note.html sitemap.xml llms.txt
          git diff --staged --quiet || git commit -m "自動更新: 公式note一覧 $(TZ=Asia/Tokyo date +'%Y/%m/%d')"
          git push

# 置き場所: このファイルを .github/workflows/note-index.yml として置くと毎朝動く。
# ここに置いてあるのは、Claude側のトークンに workflow スコープが無く、
# .github/workflows/ 配下を直接pushできないため。GitHubのウェブ画面
# (Actions > New workflow > set up a workflow yourself) に中身を貼るか、
# ローカルで .github/workflows/note-index.yml にコピーしてpushしてください。
