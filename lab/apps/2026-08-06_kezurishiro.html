<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>削りしろ｜予算を下げると、見積のどこが消えるか</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f4f0;color:#1b1a17;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
 -webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 70px}
.tag{font-size:11px;color:#8d8778;letter-spacing:.1em}
h1{font-size:26px;margin:6px 0 6px}
.lead{font-size:15px;line-height:1.75;color:#5c574c;margin:0 0 14px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.label{font-size:14px;color:#6b6558;font-weight:600}
input[type=range]{width:100%;accent-color:#2563eb;height:32px}
.money{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.money small{font-size:18px;font-weight:700;margin-left:3px}
.sum{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 2px}
.down{font-size:15px;font-weight:700;color:#2563eb}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid #efece4;font-size:16px}
.item:first-child{border-top:0}
.item .nm{line-height:1.5}
.item .amt{white-space:nowrap;font-variant-numeric:tabular-nums}
.item.cut .nm{color:#a8a294}
.item.cut .amt{color:#a8a294}
.why{font-size:13px;color:#847e70;margin-top:4px;line-height:1.6}
.why.warn{color:#a4761b}
.why.stop{color:#b4443a}
.old{text-decoration:line-through;color:#b8b2a4;margin-right:6px;font-size:14px}
.alert{border-radius:12px;padding:14px;font-size:15px;line-height:1.7;margin-top:12px}
.alert.warn{background:#fbf6e8;border:1px solid #eddfba;color:#6a5a30}
.alert.stop{background:#fdeeec;border:1px solid #f0cdc7;color:#8e372e}
.alert.ok{background:#eef3ff;color:#2d4a91}
.btn{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:14px 16px;
 font-size:16px;font-weight:600;width:100%;cursor:pointer;margin-top:12px}
.btn-ghost{background:#fff;color:#2563eb;border:1px solid #d6d2c8}
.note{font-size:13px;color:#847e70;line-height:1.75}
.sheet{background:#fffdf7;border:1px solid #e6e0d2;border-radius:14px;padding:20px}
.sheet h2{font-size:20px;margin:0 0 4px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #eee6d4;font-size:15px}
.back{background:none;border:0;color:#2563eb;font-size:15px;padding:6px 0;cursor:pointer}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.badge.w{background:#fbf1d9;color:#8a6f2a}
.badge.s{background:#fbe0dc;color:#9b3f34}
</style>
</head>
<body>
<div class="wrap">
  <div class="tag">デモ（サンプルデータ）</div>
  <h1>削りしろ</h1>
  <p class="lead">相見積で負けるのは、金額が高いからではなく、どこを削れるか答えられないから。予算のつまみを下げると、削る順に見積が減っていきます。あとで壊し直しになる線も出ます。</p>

  <div id="view"></div>
</div>

<script>
const JOB = {
  client:"野山さま邸（架空）",
  by:"みどり工務店（架空）",
  what:"水まわり4点＋内装のリフォーム",
  base:358
};
// 見積の内訳（万円）
const ITEMS = [
  {k:"kit",  n:"システムキッチン 中位グレード（食洗機つき）", a:120},
  {k:"bath", n:"ユニットバス 1616（浴室暖房乾燥機つき）",     a:98},
  {k:"nai",  n:"内装 クロス・床の張りかえ",                   a:34},
  {k:"sen",  n:"洗面化粧台の交換",                            a:22},
  {k:"kei",  n:"諸経費・現場管理",                            a:22},
  {k:"toi",  n:"トイレの交換",                                a:18},
  {k:"kai",  n:"解体・廃材処分",                              a:18},
  {k:"kan",  n:"給排水管のやりかえ",                          a:26},
];
// 削る順（上から順に効いていく）
const CUTS = [
  {k:"nai", d:10, t:"内装は水まわり3室ぶんに範囲をせまく", lv:0},
  {k:"sen", d:6,  t:"洗面化粧台を同等の型に",             lv:0},
  {k:"toi", d:5,  t:"トイレをひとつ下のグレードに",       lv:0},
  {k:"kei", d:4,  t:"現場管理の立ち会い回数を減らす",     lv:0},
  {k:"kit", d:18, t:"キッチンをひとつ下のグレードに",     lv:0},
  {k:"bath",d:12, t:"浴室暖房乾燥機を外す",               lv:1,
   w:"あとから付けると、点検口を開け直すぶんで割高になります"},
  {k:"kit", d:10, t:"キッチンの食洗機を外す",             lv:1,
   w:"あとから付けると、給排水の分岐工事が別途かかります"},
  {k:"bath",d:20, t:"ユニットバスをひとつ下のグレードに", lv:0},
  {k:"kan", d:26, t:"給排水管のやりかえを見送る",         lv:2,
   w:"壁と床を閉じたあとでは、もう一度壊さないと直せません"},
];
const MIN = JOB.base - CUTS.reduce((a,c)=>a+c.d,0); // 217

const S = {budget: JOB.base, view:"main"};

function applied(){
  let total = JOB.base, list = [];
  for(const c of CUTS){
    if(total <= S.budget) break;
    total -= c.d; list.push(c);
  }
  return {total, list};
}
function itemState(){
  const {list} = applied();
  return ITEMS.map(it=>{
    const cs = list.filter(c=>c.k===it.k);
    const d = cs.reduce((a,c)=>a+c.d,0);
    return {...it, now: it.a - d, cuts: cs};
  });
}
const esc = s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function render(){
  document.getElementById('view').innerHTML = S.view==='main' ? mainHTML() : sheetHTML();
  if(S.view==='main'){
    const r=document.getElementById('bg');
    r.addEventListener('input',e=>{ S.budget=+e.target.value; render(); });
  }
}

function mainHTML(){
  const {total, list} = applied();
  const cut = JOB.base - total;
  const maxLv = list.reduce((m,c)=>Math.max(m,c.lv||0), 0);
  const its = itemState();

  let alert='';
  if(maxLv===2) alert = `<div class="alert stop">ここから下は、あとで壊すことになります。管をそのままに壁を閉じると、次に触るときの費用は今回の削減額を超えます。<br><span class="note" style="color:inherit;opacity:.8">この線を越えるなら、工事そのものを一年後にまとめたほうが安く済みます。</span></div>`;
  else if(maxLv===1) alert = `<div class="alert warn">ここからは「今やらないと割高になる」ものに手が入っています。金額は下がりますが、次に付けるときの工事代がのります。</div>`;
  else if(cut>0) alert = `<div class="alert ok">ここまでは、あとから足せるものだけを外しています。工事の中身は変わりません。</div>`;

  return `<div class="card">
    <div class="note">${JOB.by}／${JOB.client}　${JOB.what}</div>
    <div class="sum" style="margin-top:10px">
      <div><span class="money">${total}<small>万円</small></span></div>
      <div class="down">${cut>0?`▼ ${cut}万円`:'当初見積'}</div>
    </div>
    <div class="note">当初の見積 ${JOB.base}万円　／　削れる下限 ${MIN}万円</div>
    <div class="label" style="margin-top:16px">出せる予算をここまで下げると</div>
    <input type="range" id="bg" min="${MIN}" max="${JOB.base}" step="1" value="${S.budget}">
    <div class="note" style="display:flex;justify-content:space-between"><span>${MIN}万円</span><span>${JOB.base}万円</span></div>
    ${alert}
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:8px">見積の中身</div>
    ${its.map(it=>`
      <div class="item ${it.now<it.a?'cut':''}">
        <div>
          <div class="nm">${esc(it.n)}</div>
          ${it.cuts.map(c=>`<div class="why ${c.lv===2?'stop':(c.lv===1?'warn':'')}">${esc(c.t)}　−${c.d}万円${c.w?`<br>${esc(c.w)}`:''}</div>`).join('')}
        </div>
        <div class="amt">${it.now<it.a?`<span class="old">${it.a}</span>`:''}${it.now}万</div>
      </div>`).join('')}
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:8px">削らなかった理由（施主に言えるように）</div>
    ${CUTS.filter(c=>!list.includes(c)).length===0
      ? `<div class="note">すべて削り切っています。</div>`
      : CUTS.filter(c=>!list.includes(c)).map(c=>`
        <div class="item"><div class="nm" style="font-size:15px">${esc(c.t)}
        ${c.lv===2?'<span class="badge s">壊し直しになる</span>':(c.lv===1?'<span class="badge w">あとで割高</span>':'')}
        </div><div class="amt" style="color:#847e70">−${c.d}万</div></div>`).join('')}
    <div class="note" style="margin-top:10px">値引きではなく、削る順番を先に見せる。総額だけの勝負から降りるための一枚です。</div>
  </div>

  <button class="btn" onclick="S.view='sheet';render()">施主にわたす一枚をつくる</button>`;
}

function sheetHTML(){
  const {total, list} = applied();
  const cut = JOB.base - total;
  return `<button class="back" onclick="S.view='main';render()">もどる</button>
  <div class="sheet">
    <div class="tag">${JOB.by}</div>
    <h2>${JOB.client}　${JOB.what}</h2>
    <div class="note">ご予算にあわせた見直し案</div>
    <div class="row" style="border-top:0;font-size:17px;font-weight:700">
      <span>当初のお見積</span><span>${JOB.base}万円</span></div>
    ${list.map(c=>`<div class="row"><span>${esc(c.t)}</span><span>−${c.d}万円</span></div>`).join('')}
    <div class="row" style="font-size:19px;font-weight:800;border-top:2px solid #1b1a17;margin-top:6px">
      <span>見直し後</span><span>${total}万円</span></div>
    <div class="note" style="margin-top:6px">減額 ${cut}万円</div>

    ${list.some(c=>c.lv>0) ? `
    <div style="margin-top:18px">
      <div class="label">今回見送ると、次に費用がかかるもの</div>
      ${list.filter(c=>c.lv>0).map(c=>`<div class="note" style="margin-top:8px">・${esc(c.t)}：${esc(c.w)}</div>`).join('')}
    </div>` : `<div class="note" style="margin-top:18px">今回の見直しは、あとから足せるものだけです。工事の中身は変えていません。</div>`}

    <div class="note" style="margin-top:20px;border-top:1px solid #e6e0d2;padding-top:12px">
      金額は本デモのサンプルです。実際の見積は現地調査のうえで作成します。
    </div>
  </div>
  <button class="btn btn-ghost" onclick="S.view='main';render()">もどって調整する</button>`;
}
render();
</script>
</body>
</html>
