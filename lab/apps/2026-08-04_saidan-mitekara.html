<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>祭壇みてから｜祭壇を式場の絵で見せてから選んでもらう</title>
<style>
  :root{ --bg:#f5f4f0; --ac:#2563eb; --line:#e5e1d8; --ink:#1a1a1a; --sub:#6f6b62;
         --grn:#15803d; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:#e9e6df; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:17px; line-height:1.7; -webkit-font-smoothing:antialiased; }
  .app{ max-width:430px; margin:0 auto; background:var(--bg); min-height:100vh;
    padding:0 14px 132px; }
  button{ font-family:inherit; cursor:pointer; }

  .head{ display:flex; align-items:center; justify-content:space-between;
    padding:18px 2px 2px; gap:10px; }
  .head h1{ font-size:25px; font-weight:700; margin:0; letter-spacing:-.01em; }
  .dm{ font-size:11px; color:var(--sub); border:1px solid var(--line); background:#fff;
    border-radius:999px; padding:3px 9px; white-space:nowrap; }
  .lead{ font-size:14.5px; color:var(--sub); margin:4px 2px 16px; line-height:1.65; }

  .card{ background:#fff; border-radius:14px; padding:14px;
    box-shadow:0 1px 2px rgba(20,18,14,.06); }
  .pv{ padding:12px 12px 14px; }
  .pv .pill{ display:inline-flex; align-items:center; gap:6px; background:#e8effd;
    color:var(--ac); font-size:12.5px; font-weight:700; border-radius:999px;
    padding:4px 12px; margin-bottom:10px; }
  .pv .pill i{ width:8px; height:8px; border-radius:50%; background:var(--ac); }
  .pv svg{ display:block; width:100%; height:auto; border-radius:10px; }
  .pv .cap{ font-size:14px; color:var(--sub); text-align:center; margin-top:10px;
    line-height:1.6; }
  .pv .cap b{ color:var(--ink); }

  h2{ font-size:18px; font-weight:700; margin:24px 2px 9px; }

  .chips{ display:flex; gap:8px; }
  .chips button{ flex:1; background:#fff; border:1.5px solid var(--line);
    border-radius:14px; padding:12px 4px; font-size:14.5px; font-weight:700;
    color:var(--ink); line-height:1.4; box-shadow:0 1px 2px rgba(20,18,14,.05); }
  .chips button small{ display:block; font-weight:400; font-size:12px; color:var(--sub);
    margin-top:1px; }
  .chips button.on{ border-color:var(--ac); background:#f2f6fe; color:var(--ac); }
  .chips button.on small{ color:var(--ac); }

  .opt{ display:flex; align-items:center; gap:12px; background:#fff; border:1.5px solid var(--line);
    border-radius:14px; padding:13px 14px; margin-bottom:8px; width:100%; text-align:left;
    box-shadow:0 1px 2px rgba(20,18,14,.05); }
  .opt .rd{ width:21px; height:21px; border-radius:50%; border:2px solid #cfcabd;
    flex:none; position:relative; }
  .opt.on{ border-color:var(--ac); background:#f2f6fe; }
  .opt.on .rd{ border-color:var(--ac); }
  .opt.on .rd:after{ content:''; position:absolute; inset:3px; border-radius:50%;
    background:var(--ac); }
  .opt .nm{ font-size:17px; font-weight:700; }
  .opt .ds{ font-size:13px; color:var(--sub); }
  .opt .pr{ margin-left:auto; font-size:18px; font-weight:700;
    font-variant-numeric:tabular-nums; white-space:nowrap; }

  .link{ display:block; text-align:center; color:var(--ac); font-size:15px;
    font-weight:700; background:none; border:0; width:100%; padding:16px 0 4px; }
  .brk{ background:#fff; border-radius:14px; padding:6px 15px; margin-top:6px;
    box-shadow:0 1px 2px rgba(20,18,14,.06); }
  .brk .r{ display:flex; justify-content:space-between; gap:12px; font-size:15.5px;
    padding:11px 0; border-top:1px solid #f1efe9; }
  .brk .r:first-child{ border-top:0; }
  .brk .r b{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .brk .r.sum b{ font-size:19px; }

  .okbox{ background:#e7f2ea; border-radius:14px; padding:14px 15px; margin-top:14px;
    font-size:15px; color:var(--grn); font-weight:700; line-height:1.7; }
  .foot{ font-size:13.5px; color:var(--sub); line-height:1.7; padding:18px 2px 0; }

  .dock{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:#fff;
    border-top:1px solid var(--line); max-width:430px; margin:0 auto;
    padding:10px 14px max(12px, env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:12px; }
  .dock .amt{ flex:none; line-height:1.25; }
  .dock .amt span{ display:block; font-size:11.5px; color:var(--sub); }
  .dock .amt b{ font-size:25px; font-weight:700; letter-spacing:-.02em;
    font-variant-numeric:tabular-nums; }
  .dock .amt b i{ font-size:14px; font-style:normal; margin-left:1px; }
  .go{ flex:1; border:0; border-radius:999px; background:var(--ac); color:#fff;
    font-size:16.5px; font-weight:700; padding:15px 0; line-height:1.3;
    box-shadow:0 3px 10px rgba(37,99,235,.3); }
  .go small{ display:block; font-size:11.5px; font-weight:400; opacity:.92; }
  .go.gh{ background:#fff; color:var(--ac); border:1.5px solid var(--ac); box-shadow:none; }
</style>
</head>
<body>
<div class="app">
  <div class="head"><h1>祭壇をえらぶ</h1><div class="dm">デモ（サンプルデータ）</div></div>
  <p class="lead">ひだまり会館（架空）。大きさと花の色をその場で絵にして、ご家族に見てから決めてもらいます。</p>
  <div id="body"></div>
</div>
<div class="dock" id="dock"></div>

<script>
// ===== サンプルデータ（架空の葬儀会館）=====
var HALLS = [
  {id:'s', nm:'小式場', cap:'30名まで',  fee:80000,  scale:0.88},
  {id:'m', nm:'中式場', cap:'60名まで',  fee:120000, scale:1.00},
  {id:'l', nm:'大式場', cap:'120名まで', fee:220000, scale:1.14}
];
var RANKS = [
  {id:'k', nm:'白木祭壇',    ds:'昔ながらの形',     fee:180000, rows:1, w:130, wood:true},
  {id:'h', nm:'花祭壇 標準', ds:'いちばん多い形',   fee:340000, rows:3, w:180, wood:false},
  {id:'j', nm:'花祭壇 上',   ds:'横に広く花を組む', fee:580000, rows:5, w:230, wood:false}
];
var COLORS = [
  {id:'w', nm:'白 基調',  ds:'定番',     pal:['#ffffff','#f7f5ef','#e9e5db']},
  {id:'p', nm:'淡い色',   ds:'やわらか', pal:['#ffffff','#f3dee4','#e4e8f3']},
  {id:'y', nm:'明るい色', ds:'あたたか', pal:['#fff2cf','#f8d5d5','#ffffff']}
];
var BASE = 420000;
var st = {hall:'m', rank:'h', color:'w', open:false, quoted:false};

function find(a,id){ for(var i=0;i<a.length;i++){ if(a[i].id===id) return a[i]; } }
function man(y){ return (y/10000).toFixed(1); }
function total(){ return BASE + find(HALLS,st.hall).fee + find(RANKS,st.rank).fee; }

function svg(){
  var hall = find(HALLS,st.hall), rank = find(RANKS,st.rank), col = find(COLORS,st.color);
  var w = Math.round(rank.w*hall.scale), cx = 160, floorY = 165, s = '';
  s += '<rect x="0" y="0" width="320" height="165" fill="#efece6"/>';
  s += '<rect x="0" y="165" width="320" height="45" fill="#ddd8cd"/>';
  s += '<rect x="0" y="158" width="320" height="7" fill="#e5e0d5"/>';
  s += '<rect x="26" y="96" width="9" height="62" rx="3" fill="#cfc8b9"/><circle cx="30.5" cy="92" r="7" fill="#f6e6b8"/>';
  s += '<rect x="285" y="96" width="9" height="62" rx="3" fill="#cfc8b9"/><circle cx="289.5" cy="92" r="7" fill="#f6e6b8"/>';
  var tiers = rank.rows<=1 ? 2 : 3;
  for(var t=0;t<tiers;t++){
    var tw = w - t*18, y = floorY-(t+1)*13;
    s += '<rect x="' + (cx-tw/2) + '" y="' + y + '" width="' + tw + '" height="13" fill="' +
         (t%2?'#e8e3d8':'#efeae0') + '" stroke="#d6d0c3"/>';
  }
  var deckY = floorY - tiers*13;
  if(rank.wood){
    var hw = w*0.72;
    s += '<rect x="' + (cx-hw/2) + '" y="' + (deckY-58) + '" width="' + hw + '" height="58" fill="#dcc7a2" stroke="#c9b189"/>';
    s += '<rect x="' + (cx-hw/2+8) + '" y="' + (deckY-50) + '" width="' + (hw-16) + '" height="10" fill="#cbb28c"/>';
    s += '<polygon points="' + (cx-hw/2-6) + ',' + (deckY-58) + ' ' + cx + ',' + (deckY-76) +
         ' ' + (cx+hw/2+6) + ',' + (deckY-58) + '" fill="#d3bb95" stroke="#c0a67e"/>';
    for(var i=0;i<7;i++)
      s += '<circle cx="' + (cx-hw/2+9+i*(hw-18)/6) + '" cy="' + (deckY+4) + '" r="4.5" fill="' +
           col.pal[i%col.pal.length] + '" stroke="#cfc8ba" stroke-width="0.6"/>';
  } else {
    for(var r=0;r<rank.rows;r++){
      var rw = w-r*16, y2 = deckY-6-r*15, n = Math.max(4, Math.round(rw/13));
      for(var c=0;c<n;c++){
        var x = cx-rw/2+6+c*(rw-12)/(n-1);
        s += '<circle cx="' + x.toFixed(1) + '" cy="' + y2 + '" r="5.4" fill="' +
             col.pal[(c+r)%col.pal.length] + '" stroke="#cfc8ba" stroke-width="0.6"/>';
      }
    }
    s += '<rect x="' + (cx-w/2) + '" y="' + (deckY-4) + '" width="' + w + '" height="6" rx="3" fill="#c6cfbc"/>';
  }
  var fy = deckY-6-(rank.wood ? 86 : rank.rows*15+18);
  s += '<rect x="' + (cx-27) + '" y="' + fy + '" width="54" height="42" rx="3" fill="#f7f6f2" stroke="#b9b2a4" stroke-width="2"/>';
  s += '<text x="' + cx + '" y="' + (fy+26) + '" font-size="11" fill="#9a948a" text-anchor="middle">お写真</text>';
  return s;
}

function render(){
  var hall = find(HALLS,st.hall), rank = find(RANKS,st.rank), col = find(COLORS,st.color);
  var w = Math.round(rank.w*hall.scale);

  var h = '<div class="card pv">' +
    '<div class="pill"><i></i>いま見ている内容</div>' +
    '<svg viewBox="0 0 320 210" role="img" aria-label="式場と祭壇のイメージ図">' + svg() + '</svg>' +
    '<div class="cap"><b>' + hall.nm + '</b>・<b>' + rank.nm + '</b>・花は' + col.nm +
    '<br>祭壇の幅 およそ ' + (w/40).toFixed(1) + 'm</div></div>';

  h += '<h2>式場</h2><div class="chips">';
  for(var i=0;i<HALLS.length;i++)
    h += '<button class="' + (st.hall===HALLS[i].id?'on':'') + '" onclick="set(\'hall\',\'' + HALLS[i].id + '\')">' +
      HALLS[i].nm + '<small>' + HALLS[i].cap + '</small></button>';
  h += '</div>';

  h += '<h2>祭壇</h2>';
  for(var j=0;j<RANKS.length;j++){
    var r = RANKS[j];
    h += '<button class="opt' + (st.rank===r.id?' on':'') + '" onclick="set(\'rank\',\'' + r.id + '\')">' +
      '<span class="rd"></span><span><span class="nm">' + r.nm + '</span>' +
      '<span class="ds" style="display:block">' + r.ds + '</span></span>' +
      '<span class="pr">' + man(r.fee) + '万円</span></button>';
  }

  h += '<h2>花の色あい</h2><div class="chips">';
  for(var k=0;k<COLORS.length;k++)
    h += '<button class="' + (st.color===COLORS[k].id?'on':'') + '" onclick="set(\'color\',\'' + COLORS[k].id + '\')">' +
      COLORS[k].nm + '<small>' + COLORS[k].ds + '</small></button>';
  h += '</div>';

  h += '<button class="link" onclick="toggle()">見積の内訳を' + (st.open?'閉じる':'見る') + ' ' + (st.open?'∧':'∨') + '</button>';
  if(st.open){
    h += '<div class="brk">' +
      '<div class="r"><span>基本セット<br><span style="font-size:13px;color:var(--sub)">棺・搬送・安置・式の運営</span></span><b>' + man(BASE) + '万円</b></div>' +
      '<div class="r"><span>' + hall.nm + ' 使用料</span><b>' + man(hall.fee) + '万円</b></div>' +
      '<div class="r"><span>' + rank.nm + '</span><b>' + man(rank.fee) + '万円</b></div>' +
      '<div class="r sum"><span>合計（税込）</span><b>' + man(total()) + '万円</b></div></div>';
  }
  if(st.quoted)
    h += '<div class="okbox">この内容で見積書を作りました。ご家族の携帯にも同じ絵が届くので、あとから来られたご親族にも同じものを見てもらえます。</div>';

  h += '<div class="foot">図はイメージです。花材は季節で変わります。金額は税込の目安で、' +
       'ご遺体の搬送距離・安置日数・火葬料で上下します。枠はお預かりしたお写真が入る位置です。</div>';

  document.getElementById('body').innerHTML = h;
  document.getElementById('dock').innerHTML =
    '<div class="amt"><span>見積（税込）</span><b>' + man(total()) + '<i>万円</i></b></div>' +
    (st.quoted
      ? '<button class="go gh" onclick="reset()">別の内容で見る</button>'
      : '<button class="go" onclick="quote()">この内容で見積を出す<small>＼ご家族の携帯にも届きます／</small></button>');
}
function set(k,v){ st[k] = v; st.quoted = false; render(); }
function toggle(){ st.open = !st.open; render(); }
function quote(){ st.quoted = true; render(); }
function reset(){ st.quoted = false; render(); }
render();
</script>
</body>
</html>
