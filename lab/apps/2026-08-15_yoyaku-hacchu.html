<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>よやく発注 — 来週の予約から歯科材料を逆算する</title>
<style>
  * { box-sizing:border-box; -webkit-text-size-adjust:100%; }
  body { margin:0; background:#f5f4f0; color:#1c1b19;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:17px; line-height:1.75; }
  .demoflag { background:#1c1b19; color:#fff; font-size:12px; letter-spacing:.04em; text-align:center; padding:6px 12px; }
  .wrap { max-width:880px; margin:0 auto; padding:20px 16px 64px; }
  h1 { font-size:27px; line-height:1.35; margin:18px 0 6px; letter-spacing:-.01em; }
  .lead { margin:0 0 4px; color:#55524c; font-size:16px; }
  .src { font-size:13px; color:#78746c; }
  .card { background:#fff; border:1px solid #e5e2db; border-radius:14px; padding:18px; margin:14px 0; }
  h2 { font-size:19px; margin:0 0 12px; }
  .step { font-size:12px; color:#2563eb; font-weight:700; letter-spacing:.08em; margin:0 0 4px; }
  .days { display:grid; gap:8px; }
  .day { background:#fbfaf7; border:1px solid #e5e2db; border-radius:12px; padding:11px 14px; }
  .day .dh { display:flex; justify-content:space-between; font-size:15px; }
  .day .dh b { font-size:16px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip { font-size:13px; background:#fff; border:1px solid #e5e2db; border-radius:999px; padding:2px 10px; color:#55524c; }
  .chip.hi { border-color:#2563eb; color:#2563eb; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th,td { text-align:left; padding:9px 6px; border-bottom:1px solid #eeebe4; vertical-align:middle; }
  th { font-size:13px; color:#78746c; font-weight:600; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  tr.short td { background:#fff6f2; }
  .why { font-size:13px; color:#78746c; display:block; }
  .warn { color:#b6431a; font-weight:700; font-size:13px; }
  input.qty { width:60px; font:inherit; font-size:15px; text-align:right; border:1.5px solid #e5e2db;
              border-radius:8px; padding:5px 7px; background:#fff; }
  input.qty:focus { outline:0; border-color:#2563eb; }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  button.primary { background:#2563eb; color:#fff; border:0; border-radius:12px; padding:13px 20px;
    font:inherit; font-weight:700; cursor:pointer; }
  button.primary:hover { background:#1d4fd0; }
  button.ghost { background:#fff; color:#1c1b19; border:1.5px solid #e5e2db; border-radius:12px;
    padding:13px 20px; font:inherit; cursor:pointer; }
  .sum { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px;
         border-top:2px solid #1c1b19; padding-top:10px; }
  .sum .big { font-size:25px; font-weight:700; letter-spacing:-.02em; }
  .note { font-size:13px; color:#78746c; margin-top:12px; }
  .hidden { display:none; }
  .sheet { border-top:3px solid #2563eb; }
</style>
</head>
<body>
<div class="demoflag">デモ（サンプルデータ）— 医院名・患者名・仕入先はすべて架空です</div>
<div class="wrap">

<h1>よやく発注</h1>
<p class="lead">来週の予約表から、要る材料を逆算します。棚を数えてから注文する、をやめるための道具です。</p>
<p class="src">（架空）このは歯科クリニック　チェア3台　スタッフ6名　発注担当・院長</p>

<div class="card">
  <p class="step">STEP 1</p>
  <h2>来週の予約（8月17日〜22日）</h2>
  <div class="days" id="days"></div>
  <p class="note">院内の予約システムから自動で読みます。処置の種類ごとに、1件あたりの標準的な材料の使用量を持っています。</p>
</div>

<div class="card">
  <p class="step">STEP 2</p>
  <h2>足りないもの</h2>
  <table>
    <thead><tr>
      <th>品目</th><th class="num">在庫</th><th class="num">来週要る</th><th class="num">注文</th>
    </tr></thead>
    <tbody id="tbl"></tbody>
  </table>
  <div class="sum"><span>仕入額の合計</span><span class="big" id="total">—</span></div>
  <div class="btns">
    <button class="ghost" id="only">足りないものだけにする</button>
    <button class="primary" id="mk">発注書をつくる</button>
  </div>
  <p class="note">数量は手で直せます。単価は前回の納品書の値です。値上げがあった品目には印を付けています。</p>
</div>

<div class="card sheet hidden" id="sheet"></div>

</div>

<script>
const SCHED = [
  { d:'8/17 (月)', n:22, mix:[['定期検診',9],['むし歯処置',6],['根の治療',3],['被せ物セット',3],['抜歯',1]] },
  { d:'8/18 (火)', n:19, mix:[['定期検診',7],['むし歯処置',5],['根の治療',4],['被せ物セット',2],['インプラント',1]] },
  { d:'8/19 (水)', n:11, mix:[['定期検診',6],['むし歯処置',3],['被せ物セット',2]] },
  { d:'8/20 (木)', n:24, mix:[['定期検診',10],['むし歯処置',7],['根の治療',3],['被せ物セット',3],['矯正調整',1]] },
  { d:'8/21 (金)', n:21, mix:[['定期検診',8],['むし歯処置',6],['根の治療',2],['被せ物セット',3],['抜歯',2]] },
  { d:'8/22 (土)', n:26, mix:[['定期検診',12],['むし歯処置',8],['被せ物セット',4],['抜歯',2]] },
];

// 1件あたりの標準使用量（デモ用のざっくり値）
const USE = {
  '定期検診':      { 'グローブ(枚)':2, '紙エプロン(枚)':1, '滅菌パック(枚)':1, 'ポリッシングペースト(本)':0.05, 'フッ化物(本)':0.04 },
  'むし歯処置':    { 'グローブ(枚)':2, '紙エプロン(枚)':1, '滅菌パック(枚)':2, 'コンポジットレジン(本)':0.12, '接着材(本)':0.09, '麻酔カートリッジ(本)':1, '注射針(本)':1 },
  '根の治療':      { 'グローブ(枚)':2, '紙エプロン(枚)':1, '滅菌パック(枚)':2, '根管充填材(本)':0.15, 'ペーパーポイント(箱)':0.05, '麻酔カートリッジ(本)':1, '注射針(本)':1 },
  '被せ物セット':  { 'グローブ(枚)':2, '紙エプロン(枚)':1, '滅菌パック(枚)':1, '合着セメント(本)':0.18, '印象材(袋)':0.20 },
  '抜歯':          { 'グローブ(枚)':3, '紙エプロン(枚)':1, '滅菌パック(枚)':2, '麻酔カートリッジ(本)':2, '注射針(本)':1, '縫合糸(本)':0.6 },
  'インプラント':  { 'グローブ(枚)':4, '紙エプロン(枚)':1, '滅菌パック(枚)':3, '麻酔カートリッジ(本)':2, '注射針(本)':1, '縫合糸(本)':1 },
  '矯正調整':      { 'グローブ(枚)':2, '紙エプロン(枚)':1, '結紮モジュール(袋)':0.3 },
};

const STOCK = {
  'グローブ(枚)':          { have:180, lot:100, unit:1150, name:'グローブ 100枚入', up:true },
  '紙エプロン(枚)':        { have:400, lot:250, unit:2100, name:'紙エプロン 250枚入' },
  '滅菌パック(枚)':        { have:150, lot:200, unit:2800, name:'滅菌パック 200枚入' },
  'コンポジットレジン(本)':{ have:2,   lot:1,   unit:4800, name:'コンポジットレジン 1本' },
  '接着材(本)':            { have:1,   lot:1,   unit:9600, name:'ボンディング材 1本', up:true },
  '麻酔カートリッジ(本)':  { have:40,  lot:50,  unit:5200, name:'麻酔カートリッジ 50本入' },
  '注射針(本)':            { have:60,  lot:100, unit:3400, name:'歯科用注射針 100本入' },
  '根管充填材(本)':        { have:1,   lot:1,   unit:6200, name:'根管充填材 1本' },
  'ペーパーポイント(箱)':  { have:2,   lot:1,   unit:2600, name:'ペーパーポイント 1箱' },
  '合着セメント(本)':      { have:1,   lot:1,   unit:11800, name:'合着セメント 1本' },
  '印象材(袋)':            { have:2,   lot:1,   unit:4300, name:'アルジネート印象材 1袋' },
  '縫合糸(本)':            { have:8,   lot:12,  unit:7200, name:'縫合糸 12本入' },
  'ポリッシングペースト(本)':{ have:3, lot:1,   unit:1900, name:'研磨ペースト 1本' },
  'フッ化物(本)':          { have:2,   lot:1,   unit:2400, name:'フッ化物歯面塗布材 1本' },
  '結紮モジュール(袋)':    { have:4,   lot:1,   unit:3100, name:'結紮モジュール 1袋' },
};

let need = {}, order = {}, onlyShort = false;

function calcNeed(){
  need = {};
  const why = {};
  SCHED.forEach(day => day.mix.forEach(([proc, cnt]) => {
    const u = USE[proc] || {};
    for (const k in u) {
      need[k] = (need[k] || 0) + u[k] * cnt;
      why[k] = why[k] || {};
      why[k][proc] = (why[k][proc] || 0) + cnt;
    }
  }));
  for (const k in need) need[k] = Math.ceil(need[k]);
  return why;
}

function defaultOrder(){
  order = {};
  for (const k in need) {
    const s = STOCK[k];
    const gap = need[k] - s.have;
    order[k] = gap > 0 ? Math.ceil(gap / s.lot) : 0;
  }
}

function drawDays(){
  document.getElementById('days').innerHTML = SCHED.map(d => `
    <div class="day">
      <div class="dh"><b>${d.d}</b><span>${d.n}人</span></div>
      <div class="chips">${d.mix.map(([p,c]) =>
        `<span class="chip ${['インプラント','抜歯','根の治療'].includes(p)?'hi':''}">${p} ${c}</span>`).join('')}</div>
    </div>`).join('');
}

function drawTable(why){
  const keys = Object.keys(need).sort((a,b) => (STOCK[b].have < need[b] ? 1:0) - (STOCK[a].have < need[a] ? 1:0));
  const rows = keys.filter(k => !onlyShort || STOCK[k].have < need[k]);
  document.getElementById('tbl').innerHTML = rows.map(k => {
    const s = STOCK[k], short = s.have < need[k];
    const top = Object.entries(why[k]).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([p,c])=>`${p}${c}件`).join('・');
    return `<tr class="${short?'short':''}">
      <td>${k}<span class="why">${top} で使います${s.up?' ／ <span class="warn">単価が前回より上がっています</span>':''}</span></td>
      <td class="num">${s.have}</td>
      <td class="num">${need[k]}${short?'<span class="why warn">'+(need[k]-s.have)+' 足りません</span>':''}</td>
      <td class="num"><input class="qty" type="number" min="0" step="1" value="${order[k]}" data-k="${k}">
        <span class="why">${s.name}</span></td>
    </tr>`;
  }).join('');
  document.querySelectorAll('.qty').forEach(i => i.oninput = () => {
    order[i.dataset.k] = Math.max(0, +i.value || 0); total();
  });
  total();
}

function total(){
  let t = 0;
  for (const k in order) t += order[k] * STOCK[k].unit;
  document.getElementById('total').textContent = (t/10000).toFixed(1) + '万円';
  return t;
}

document.getElementById('only').onclick = () => {
  onlyShort = !onlyShort;
  document.getElementById('only').textContent = onlyShort ? 'ぜんぶ表示する' : '足りないものだけにする';
  drawTable(WHY);
};

document.getElementById('mk').onclick = () => {
  const t = total();
  const lines = Object.keys(order).filter(k => order[k] > 0);
  const el = document.getElementById('sheet');
  el.classList.remove('hidden');
  el.innerHTML = `
    <p class="step">発注書（案）</p>
    <h2>2026年8月15日　（架空）このは歯科クリニック</h2>
    <p class="src">仕入先：（架空）みなみ歯科商会　担当・小柳　／　希望納品日 8月17日(月) 午前</p>
    ${lines.length ? `<table><thead><tr><th>品目</th><th class="num">数量</th><th class="num">金額</th></tr></thead>
      <tbody>${lines.map(k => `<tr><td>${STOCK[k].name}</td><td class="num">${order[k]}</td>
        <td class="num">${(order[k]*STOCK[k].unit).toLocaleString()}円</td></tr>`).join('')}</tbody></table>
      <div class="sum"><span>合計（税別）</span><span class="big">${(t/10000).toFixed(1)}万円</span></div>`
      : '<p>注文するものはありません。</p>'}
    <p class="note">この画面では送信しません。内容を確かめて、いつもの方法で流してください。
    数量は「来週の予約 ${SCHED.reduce((a,d)=>a+d.n,0)}件」から逆算した目安です。キャンセルや急患で増減します。</p>`;
  el.scrollIntoView({ behavior:'smooth', block:'start' });
};

const WHY = calcNeed();
defaultOrder();
drawDays();
drawTable(WHY);
</script>
</body>
</html>
